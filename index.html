<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

<style>
  :root{
    --bg:#191714; --card:#221f1b; --surface2:#2b2723; --ink:#efe7d9; --ink2:#a99e8f; --line:#38332c;
    --accent:#c77455; --accent-ink:#191714;
    --green:#4fae7a; --yellow:#e0b23f; --orange:#e2823f; --red:#dc5142; --grey:#8a8175; --blue:#6b93d6;
    --serif:'Playfair Display',Georgia,'Times New Roman',serif;
    --mono:'Space Mono','SFMono-Regular',Menlo,Consolas,monospace;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 34px rgba(0,0,0,.4);
    --radius:14px;
    --topbar-bg:#1c1915; --showbar-bg:#211d18; --input-bg:#211d18;
    --chip-bg:#241f1a; --chip-ink:#b7ac9b;
    --btn-dark-bg:#efe7d9; --btn-dark-ink:#1c1510;
    --banner-bg:#2a2016; --banner-line:#4d3b24; --banner-ink:#e7c48f;
  }
  :root[data-theme="light"]{
    --bg:#f4eee3; --card:#fffdf7; --surface2:#ece4d6; --ink:#211e19; --ink2:#857b6b; --line:#e3dacb;
    --accent:#bd5f45;
    --green:#1f9d57; --yellow:#c98f14; --orange:#cf6420; --red:#c5302a; --grey:#8a8073; --blue:#2f6fd0;
    --shadow:0 1px 2px rgba(60,45,25,.07),0 12px 30px rgba(60,45,25,.10);
    --topbar-bg:#fffdf7; --showbar-bg:#efe8db; --input-bg:#fffdf7;
    --chip-bg:#ece4d5; --chip-ink:#6d6455;
    --btn-dark-bg:#211e19; --btn-dark-ink:#f5efe5;
    --banner-bg:#f7ecd7; --banner-line:#e6cfa0; --banner-ink:#8a5a12;
  }
  :root[data-theme="light"] .chip.warn{background:#f7ecd7;color:#8a5a12;border-color:#e6cfa0}
  :root[data-theme="light"] .chip.bad{background:#f7dcd8;color:#a3271f;border-color:#e9b3ac}
  :root[data-theme="light"] .chip.ok{background:#dff0e4;color:#1c7a45;border-color:#b6ddc2}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--serif);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
  .barlow{font-family:var(--serif);font-weight:700}
  .wrap{max-width:680px;margin:0 auto;padding:0 16px}
  header.top{position:sticky;top:0;z-index:40;background:var(--topbar-bg);color:var(--ink);padding:calc(env(safe-area-inset-top) + 10px) 0 10px;box-shadow:0 1px 0 var(--line),0 3px 16px rgba(0,0,0,.42)}
  .top .wrap{display:flex;align-items:center;gap:10px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700}
  .brand .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
  .brand .logo svg{width:18px;height:18px;color:#fff}
  .brand b{font-family:var(--serif);font-size:23px;letter-spacing:.3px;line-height:1;font-weight:700}
  .brand small{display:block;font-family:var(--mono);font-size:9.5px;color:var(--ink2);font-weight:400;letter-spacing:2px;text-transform:uppercase;margin-top:2px}
  .top .spacer{flex:1}
  .iconbtn{background:transparent;border:1px solid var(--line);color:var(--ink);width:38px;height:38px;border-radius:10px;font-size:18px;cursor:pointer;display:grid;place-items:center}
  .iconbtn:active{transform:scale(.95)}
  .showbar{background:var(--showbar-bg);border-top:1px solid var(--line)}
  .showbar .wrap{display:flex;align-items:center;gap:10px;padding-top:8px;padding-bottom:8px}
  .showchip{flex:1;display:flex;align-items:center;gap:10px;background:var(--chip-bg);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600}
  .showchip .ji{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;flex:0 0 26px}
  .showchip .ji svg{width:15px;height:15px;color:#fff}
  .showchip .nm{font-size:16px;font-family:var(--serif);line-height:1.1}
  .showchip .sub{font-family:var(--mono);font-size:10px;color:var(--ink2);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
  .showchip .car{margin-left:auto;color:var(--ink2)}
  main{padding-top:16px;min-height:60vh}
  h2.section{font-family:var(--serif);font-size:27px;margin:6px 0 12px;letter-spacing:0;font-weight:700;color:var(--ink)}
  h2.section.sm{font-size:19px}
  .muted{color:var(--ink2)}
  .row{display:flex;gap:10px;align-items:center}
  .between{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .unit{display:flex;gap:0;margin-bottom:11px;overflow:hidden;cursor:pointer}
  .swipe-wrap{position:relative;overflow:hidden;border-radius:14px;margin-bottom:11px}
  .swipe-actions{position:absolute;top:0;right:0;bottom:0;display:flex;z-index:0}
  .swipe-act{border:none;color:#fff;font-weight:700;font-size:13px;width:120px;display:grid;place-items:center;cursor:pointer;font-family:var(--mono);letter-spacing:.3px}
  .swipe-act.off{background:var(--blue)}
  .swipe-maphint{position:absolute;left:0;top:0;bottom:0;width:120px;display:grid;place-items:center;background:var(--green);color:#fff;font-family:var(--mono);font-weight:700;font-size:13px;z-index:0}
  .swipe-act.del{background:var(--red)}
  .swipe-card{position:relative;z-index:1;transition:transform .2s ease;will-change:transform;touch-action:pan-y}
  .swipe-card.unit,.swipe-card.jobrow{margin-bottom:0}
  .unit .stripe{width:8px;flex:0 0 8px}
  .unit .body{flex:1;padding:12px 14px;min-width:0}
  .unit .body .l1{display:flex;align-items:center;gap:8px}
  .unit .tag{font-family:var(--serif);font-size:20px;font-weight:700;letter-spacing:.3px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .uloc{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);margin-top:5px}
  .uloc svg{width:15px;height:15px;flex:0 0 15px}
  .uloc.bad{color:var(--red)} .uloc.transit{color:var(--blue)}
  .pill{font-family:var(--mono);font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px;color:#fff;white-space:nowrap;text-transform:uppercase;letter-spacing:.5px}
  .fuel{display:flex;align-items:center;gap:9px;margin-top:10px}
  .fuel .fl{font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--ink2)}
  .fuel .track{flex:1;height:7px;border-radius:6px;background:var(--surface2);overflow:hidden}
  .fuel .fill{height:100%;border-radius:6px}
  .fuel .pct{font-family:var(--mono);font-size:12px;font-weight:700;min-width:38px;text-align:right}
  .chip{font-family:var(--mono);font-size:10.5px;font-weight:400;padding:3px 8px;border-radius:8px;background:var(--chip-bg);color:var(--chip-ink);border:1px solid var(--line);white-space:nowrap}
  .chip.warn{background:#33271a;color:#e6ab5c;border-color:#5a4327}
  .chip.bad{background:#331e1b;color:#ec8a7e;border-color:#5a2f2a}
  .chip.ok{background:#1e2a22;color:#79c79b;border-color:#2f4a3a}
  .metaline{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;align-items:center}
  .fresh{font-family:var(--mono);font-size:11px;color:var(--ink2);display:flex;align-items:center;gap:5px}
  .fresh.stale{color:var(--orange)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;padding:13px 16px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--mono);letter-spacing:.3px;background:var(--surface2);color:var(--ink)}
  .btn:active{transform:translateY(1px)}
  .btn svg{width:17px;height:17px}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.dark{background:var(--btn-dark-bg);color:var(--btn-dark-ink)}
  .btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
  .btn.danger{background:var(--red);color:#fff}
  .btn.sm{padding:9px 12px;font-size:12px;border-radius:10px}
  .btn.block{width:100%}
  .btn.wide{flex:1}
  .fab-scan{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:45;width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;display:grid;place-items:center;box-shadow:0 8px 20px rgba(199,116,85,.5)}
  .fab-scan svg{width:26px;height:26px}
  .fab-scan span{position:absolute;bottom:-16px;font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--accent)}
  nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:44;background:var(--topbar-bg);border-top:1px solid var(--line);box-shadow:0 -2px 16px rgba(0,0,0,.42);padding-bottom:env(safe-area-inset-bottom)}
  nav.bottom .inner{max-width:680px;margin:0 auto;display:flex}
  nav.bottom button{flex:1;background:none;border:none;padding:10px 2px 9px;cursor:pointer;color:var(--ink2);font-size:9.5px;font-weight:700;font-family:var(--mono);text-transform:uppercase;letter-spacing:1px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
  nav.bottom button svg{width:23px;height:23px}
  nav.bottom button.active{color:var(--accent)}
  .navbadge{position:absolute;top:4px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:none;align-items:center;justify-content:center;line-height:1}
  .navbadge.on{display:flex}
  label.fld{display:block;margin:0 0 12px}
  label.fld .lb{display:block;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
  input,select,textarea{width:100%;font-family:var(--mono);font-size:16px;padding:12px 13px;border:1.5px solid var(--line);border-radius:11px;background:var(--input-bg);color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  textarea{resize:vertical;min-height:70px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .searchbar{display:flex;align-items:center;gap:9px;background:var(--input-bg);border:1.5px solid var(--line);border-radius:11px;padding:0 12px;margin-bottom:12px}
  .searchbar svg{width:17px;height:17px;color:var(--ink2);flex:0 0 17px}
  .searchbar input{border:none;background:none;padding:11px 0}
  .filterbar{display:flex;gap:7px;margin-bottom:13px;overflow:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .fchip{white-space:nowrap;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink2);padding:7px 13px;border-radius:999px;font-weight:700;font-size:11px;cursor:pointer;font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px}
  .fchip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .fchip.on.down{background:var(--red);border-color:var(--red)}
  .overlay{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.62);display:none;align-items:flex-end;justify-content:center}
  .overlay.on{display:flex}
  .sheet{background:var(--bg);width:100%;max-width:680px;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:0 0 24px;border-top:1px solid var(--line)}
  .sheet .sh-top{position:sticky;top:0;background:var(--bg);padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);z-index:2}
  .sheet .sh-top h3{margin:0;font-family:var(--serif);font-size:23px;letter-spacing:.2px;flex:1;font-weight:700}
  .sheet .sh-body{padding:16px}
  .closex{background:var(--surface2);border:1px solid var(--line);width:34px;height:34px;border-radius:9px;font-size:18px;cursor:pointer;color:var(--ink2)}
  .stathead{border-radius:var(--radius);padding:16px;color:#fff;box-shadow:var(--shadow)}
  .stathead .big{font-family:var(--serif);font-size:31px;font-weight:700;line-height:1}
  .stathead .sub{opacity:.95;font-size:13px;margin-top:4px;font-family:var(--mono)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
  .kv .k{color:var(--ink2);font-weight:400;font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .sub-tabs{display:flex;gap:6px;margin:14px 0 4px;overflow:auto;-webkit-overflow-scrolling:touch}
  .sub-tabs button{white-space:nowrap;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink2);padding:8px 13px;border-radius:999px;font-weight:700;font-size:11px;cursor:pointer;font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px}
  .sub-tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .empty{text-align:center;padding:40px 16px;color:var(--ink2)}
  .empty .em{font-size:40px;margin-bottom:10px}
  .listitem{padding:12px 14px;border-bottom:1px solid var(--line)}
  .listitem:last-child{border-bottom:none}
  .banner{background:var(--banner-bg);border:1px solid var(--banner-line);color:var(--banner-ink);border-radius:12px;padding:11px 13px;font-size:13px;margin-bottom:14px;line-height:1.45}
  .segwrap{display:flex;gap:0;border:1.5px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface2)}
  .segwrap button{flex:1;border:none;background:var(--surface2);padding:11px 6px;font-weight:700;font-size:12px;cursor:pointer;color:var(--ink2);font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px}
  .segwrap button.on{color:#fff}
  #reader{width:100%;border-radius:12px;overflow:hidden;background:#000;min-height:250px}
  .qrbox{display:grid;place-items:center;padding:14px;background:#fff;border-radius:12px}
  #map{height:62vh;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface2);isolation:isolate}
  .jobrow{cursor:pointer;padding:15px;margin-bottom:11px}
  .jobrow .jt{font-family:var(--serif);font-size:21px;font-weight:700}
  .jobrow .jsub{font-family:var(--mono);font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
  .hbar{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
  .hchip{font-family:var(--mono);font-size:11px;font-weight:700;padding:5px 10px;border-radius:8px;display:flex;align-items:center;gap:6px;background:var(--surface2);color:var(--ink2)}
  .hchip .dot{width:8px;height:8px;border-radius:50%}
  .hchip.alarm{background:#331e1b;color:#ec8a7e}
  .hchip.warnh{background:#33271a;color:#e6ab5c}
  .backbtn{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--ink2);font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:1px;cursor:pointer;padding:0;margin-bottom:8px}
  .backbtn svg{width:16px;height:16px}
  .checkrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .checkrow input[type=checkbox]{width:22px;height:22px}
  .toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--surface2);color:var(--ink);padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;z-index:2200;box-shadow:0 8px 24px rgba(0,0,0,.5);opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center;border:1px solid var(--line);font-family:var(--mono)}
  .toast.on{opacity:1}
  #updateBar{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:50%;transform:translateX(-50%);z-index:2300;background:var(--accent);color:#fff;border:none;border-radius:999px;padding:10px 18px;font-family:var(--mono);font-size:12px;font-weight:700;box-shadow:var(--shadow);cursor:pointer}
  a{color:var(--accent)}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  hr.sep{border:none;border-top:1px solid var(--line);margin:16px 0}
  table.rc{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12px}
  table.rc th,table.rc td{padding:5px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
  table.rc th{font-weight:600;color:var(--ink2);font-size:10px;line-height:1.3}
  table.rc td.rcm,table.rc th.rcm{text-align:left;color:var(--ink2);font-weight:700;position:sticky;left:0;background:var(--bg)}
  table.rc td.rclatest{font-weight:700;color:var(--ink)}
  .rcna{opacity:.4}
  .rcar{opacity:.65;font-size:10px}
  .rcw{font-weight:400;opacity:.65}
  .rcnow{color:var(--accent);font-weight:700}
  .favstar{background:none;border:none;font-size:20px;line-height:1;cursor:pointer;padding:0 2px}
  .photostrip{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
  .photostrip .ph{position:relative;width:66px;height:66px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
  .photostrip img{width:100%;height:100%;object-fit:cover;cursor:pointer;display:block}
  .photostrip .rm{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;line-height:1;cursor:pointer;padding:0}
  #photoOverlay{position:fixed;inset:0;z-index:2100;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;padding:20px}
  #photoOverlay.on{display:flex}
  #photoOverlay img{max-width:96%;max-height:92%;border-radius:12px}
  .evrow{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
  .evrow .ei{width:30px;height:30px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;flex:0 0 30px}
  .evrow .ei svg{width:16px;height:16px;color:var(--ink2)}
  .evrow .et{flex:1;min-width:0}
  .evrow .ett{font-size:14px} .evrow .etm{font-family:var(--mono);font-size:11px;color:var(--ink2);margin-top:2px}
  #authgate{position:fixed;inset:0;z-index:3000;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px}
  #authgate .au-card{width:100%;max-width:340px;text-align:center}
  #authgate .au-logo{width:56px;height:56px;border-radius:15px;background:var(--accent);display:grid;place-items:center;margin:0 auto 14px}
  #authgate .au-logo svg{width:32px;height:32px;color:#fff}
  #authgate .au-h1{font-family:var(--serif);font-size:32px;margin:0;font-weight:700}
  #authgate .au-sub{font-family:var(--mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--ink2);margin:2px 0 22px}
  #authgate input{margin-bottom:10px;text-align:center}
  #authgate .au-msg{font-family:var(--mono);font-size:12px;color:var(--ink2);margin-top:14px;min-height:16px}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><div class="logo" id="logoIc"></div><div><b>FLEETVIEW</b><small>Generator Tracker</small></div></div>

      if(pct!=null&&pct>=30)msgs.push('Oil '+op+' psi — below the '+name+' running floor ('+sp.oilRun.lo+') at '+pct+'% load.');

function reportsFor(id){return S.reports.filter(r=>r.unitId===id).sort((a,b)=>b.timestamp-a.timestamp);}
function issuesFor(id){return S.issues.filter(i=>i.unitId===id).sort((a,b)=>b.timestamp-a.timestamp);}
function openIssuesFor(id){return issuesFor(id).filter(i=>!i.resolved);}
function lastReport(id){return reportsFor(id)[0]||null;}
function latestFuel(u){const r=reportsFor(u.id).find(r=>r.fuelLevelPct!=null);return r?r.fuelLevelPct:null;}
function lastCheckTs(u){const r=lastReport(u.id);return r?r.timestamp:null;}
/* ===== ALERT PREDICATES — one definition per alert, used by every surface =====
   The Alerts screen, the nav badge and job health all read these, so no surface can
   drift from another. Gating lives HERE rather than in a render filter, because the
   question "does this unit owe me something?" is a property of the unit, not of the
   screen you happen to be on.

   owesCheck: a unit that isn't on a job can't be checked, and a staged unit has
   nothing to observe yet — 20 generators placed in a day, some not running for a
   week, must not nag. So: on a job AND running, then the staleness clock.
   lowFuel: fuel on a staged machine isn't news. Running only.
   isHardDown / needsService: fire regardless of assignment. A machine broken or
   overdue for service in the Jersey shop is precisely what the service department
   needs to see — that's the point of the app. Service won't flood, because a unit
   with blank hours has no countdown at all. */
function onJob(u){return !!u&&u.locationType==='show';}
function owesCheck(u,e){
  if(!onJob(u))return false;
  const st=e?engStatus(u,e):((u&&u.opStatus)||'staged');
  if(st!=='running')return false;
  const t=e?engLastTs(u,e):lastCheckTs(u);
  const h=(S.settings.staleHours||6)*3600e3;
  return !t||(now()-t)>h;}
function isStale(u){if(isTwin(u))return ENG.some(e=>owesCheck(u,e));return owesCheck(u,null);}
function lowFuel(u){const f=latestFuel(u);return f!=null&&f<20&&chassisStatus(u)==='running';}
function isHardDown(u){return computeStatus(u).color==='red';}
function needsService(u){const s=serviceState(u).state;return s==='over'||s==='soon';}
function unitGps(u){let best=null;S.movements.filter(m=>m.unitId===u.id).forEach(e=>{if(e.gps&&(!best||e.timestamp>best.ts))best={ts:e.timestamp,g:e.gps};});return best?best.g:null;}
function dayOfShow(s){if(!s||!s.startDate)return null;const a=new Date(s.startDate);a.setHours(0,0,0,0);const b=new Date();b.setHours(0,0,0,0);const d=Math.floor((b-a)/86400000)+1;return d>=1?d:null;}
function requireTech(cb){if(S.settings.techName){cb();return;}
  sheet('Who are you?',`<p class="muted" style="margin-top:0">Your name gets stamped on every check, issue, and scan.</p><label class="fld"><span class="lb">Your name</span><input id="techIn" placeholder="e.g. Mike R."/></label><button class="btn primary block" onclick="saveTech()">Save & continue</button>`);
  setTimeout(()=>{$('#techIn')&&$('#techIn').focus();},200);pendingTechCb=cb;}
let pendingTechCb=null;
function saveTech(){const v=$('#techIn').value.trim();if(!v){toast('Enter your name');return;}S.settings.techName=v;save();closeSheet();if(pendingTechCb){const cb=pendingTechCb;pendingTechCb=null;cb();}}
/* ===== ENGINES — true TwinPak: one NES line item, one record, two engines =====
   `units.engines` present  <=>  true TwinPak. Canonical tags are ALWAYS 'A'/'B';
   `style` only changes the label ("Gen A" vs "Gen 1"), so relabelling the housing
   never breaks history. Hours and status are DERIVED per engine, never merged:
   untagged history is pre-split and inherits to A; B NEVER falls back, so a fresh
   Engine B reads "no checks yet" instead of inheriting the old merged meter. */
const ENG=['A','B'];
/* A true TwinPak is two engines in one container, wired together permanently. It is
   never separated, so there is no un-twin operation anywhere in this app: no toggle,
   no gate, no archived state. Twin status is written ONLY by the roster import.
   Two generators bolted to a shared chassis are NOT a twin - they are two assets that
   get swapped and re-paired constantly, and nothing here marries them. */
function isTwin(u){const e=u&&u.engines;return !!(e&&typeof e==='object'&&!Array.isArray(e)&&(e.A||e.B));}
function engList(u){return isTwin(u)?ENG.slice():[null];}
/* Style is display only; canonical tags are always A and B underneath. Unset means
   nobody has read the housing yet, so it returns null and labels read "Engine 1" and
   "Engine 2" instead of claiming a stencil that may not be there. */
function engStyle(u){const st=u&&u.engines&&u.engines.style;return st==='12'?'12':(st==='AB'?'AB':null);}
function engName(u,e){if(!e)return '';const st=engStyle(u);return st?('Gen '+(st==='12'?(e==='A'?'1':'2'):e)):('Engine '+(e==='A'?'1':'2'));}
function engMeta(u,e){const es=u&&u.engines;if(!es||!e)return{};return (es[e]&&typeof es[e]==='object')?es[e]:{};}
function engMine(r,e){return e==='A'?(r.engine==='A'||r.engine==null):r.engine===e;}
function engReports(u,e){const rs=reportsFor(u.id);return e?rs.filter(r=>engMine(r,e)):rs;}
function engKva(u,e){const v=(e&&isTwin(u))?engMeta(u,e).kvaEach:(u&&u.kw);const n=(v==null||v==='')?null:parseFloat(v);return (n&&n>0)?n:null;}
function engHours(u,e){
  if(!isTwin(u)||!e)return (u&&u.currentHours!=null)?u.currentHours:null;
  const r=engReports(u,e).find(x=>x.engineHours!=null);
  if(r)return r.engineHours;
  return e==='A'?((u.currentHours!=null)?u.currentHours:null):null;}
function engPreSplit(u,e){if(!isTwin(u)||e!=='A')return false;const r=engReports(u,'A').find(x=>x.engineHours!=null);return r?(r.engine==null):(u.currentHours!=null);}
function engStatus(u,e){
  if(!isTwin(u)||!e)return (u&&u.opStatus)||'staged';
  const m=engMeta(u,e);
  if(m.opStatus)return m.opStatus;
  return e==='A'?((u&&u.opStatus)||'staged'):null;}
/* Chassis aggregates on the FAILURE axis only: any engine down => the trailer is
   red, any engine running => the trailer is running (one engine on standby is
   normal, not idle), staged only when nothing runs. An unobserved engine never
   downgrades the chassis — otherwise every conversion would flip a working
   machine grey the moment it was converted. */
function chassisStatus(u){
  if(!isTwin(u))return (u&&u.opStatus)||'staged';
  const sts=ENG.map(e=>engStatus(u,e)).filter(Boolean);
  if(!sts.length)return (u&&u.opStatus)||'staged';
  if(sts.indexOf('down')>=0)return 'down';
  if(sts.indexOf('running')>=0)return 'running';
  if(sts.indexOf('maintenance')>=0)return 'maintenance';
  return 'staged';}
function downEngines(u){return isTwin(u)?ENG.filter(e=>engStatus(u,e)==='down'):[];}
function engLastTs(u,e){const r=engReports(u,e)[0];return r?r.timestamp:null;}
function engStale(u,e){return owesCheck(u,e);}
/* Has this engine ever had hours read off ITS OWN meter? Inherited pre-split hours
   do NOT count: a deterministic assignment of old merged history makes it
   consistent, not correct. Until each engine has its own observed reading, its
   countdown is running against a number nobody attributed to it — the same freeze
   failure the prefill used to cause. Surfaced on the unit card so an incomplete
   binding pass is visible from the Fleet list without opening anything. */
function engNeedsReading(u,e){if(!isTwin(u)||!e)return false;
  return !S.reports.some(r=>r.unitId===u.id&&r.engine===e&&r.engineHours!=null);}
function twinGaps(u){return isTwin(u)?ENG.filter(e=>engNeedsReading(u,e)):[];}
/* ===== STATUS, ONE TAP =====
   Placing 20 generators in a day cannot mean 20 check forms. This writes on tap.
   It records an EVENT, not a silent field set: who, when, what. The model is
   append-only and hours derive from reports, so losing "when did this go down and
   who called it" would be a real loss.
   A status event is NOT a check: it lives in its own table, so it never touches the
   freshness clock and never enters the hours-derivation path.
   Rule 3: the control starts on the unit's CURRENT status. An engine nobody has
   observed yet starts on nothing at all, rather than claiming a default. */
const STATUS_OPTS=[['running','Running','var(--green)'],['staged','Staged','var(--grey)'],['down','Down','var(--red)']];
function statusSeg(u,e){const cur=e?engStatus(u,e):((u&&u.opStatus)||'staged');
  return `<div class="segwrap" style="margin:0">${STATUS_OPTS.map(([v,l,c])=>`<button type="button" data-v="${v}" class="${cur===v?'on':''}" style="${cur===v?('background:'+c+';color:#fff'):''}" onclick="setStatus('${u.id}','${e||''}','${v}')">${l}</button>`).join('')}</div>`;}
function statusEventsFor(id,e){return (S.status_events||[]).filter(x=>x.unitId===id&&(e?x.engine===e:true)).sort((a,b)=>b.timestamp-a.timestamp);}
function setStatus(unitId,eng,st){const u=unitById(unitId);if(!u)return;const e=(eng&&isTwin(u))?eng:null;
  const cur=e?engStatus(u,e):((u&&u.opStatus)||'staged');
  if(cur===st)return;
  requireTech(()=>{
    S.status_events=S.status_events||[];
    S.status_events.push({id:uid('se'),unitId:unitId,engine:e,status:st,techName:S.settings.techName,timestamp:now()});
    if(e){const eg=Object.assign({},u.engines);eg[e]=Object.assign({},(eg[e]&&typeof eg[e]==='object')?eg[e]:{},{opStatus:st});u.engines=eg;}
    else u.opStatus=st;
    u.updatedAt=now();save();renderUnit(unitId);
    toast((e?engName(u,e):'Unit')+' set to '+st);

/* ===== STATUS ===== */
function svcCalc(due,cur){if(due==null||cur==null)return{state:'unknown',remaining:null};const rem=Math.round((due-cur)*10)/10;if(rem<=0)return{state:'over',remaining:rem};if(rem<=(S.settings.warnHours||20))return{state:'soon',remaining:rem};return{state:'ok',remaining:rem};}
function engServiceState(u,e){if(!isTwin(u)||!e)return svcCalc(u?u.serviceDueHours:null,u?u.currentHours:null);const m=engMeta(u,e);return svcCalc(m.serviceDueHours,engHours(u,e));}
const SVC_RANK={unknown:0,ok:1,soon:2,over:3};
function worstServiceEngine(u){let we=null,best=null;ENG.forEach(e=>{const s=engServiceState(u,e);if(!best||SVC_RANK[s.state]>SVC_RANK[best.state]){best=s;we=e;}});return{engine:we,sv:best||{state:'unknown',remaining:null}};}
function serviceState(u){if(!isTwin(u))return svcCalc(u?u.serviceDueHours:null,u?u.currentHours:null);return worstServiceEngine(u).sv;}
const SC={green:'var(--green)',yellow:'var(--yellow)',orange:'var(--orange)',red:'var(--red)',grey:'var(--grey)',blue:'var(--blue)'};
function computeStatus(u){
  const reasons=[];const oi=openIssuesFor(u.id);const sv=serviceState(u);const fuel=latestFuel(u);
  const tw=isTwin(u);const st=chassisStatus(u);const de=downEngines(u);
  const down=st==='down'||oi.some(i=>i.severity==='down');
  const maint=st==='maintenance'||oi.some(i=>i.severity==='maintenance');
  const cosm=oi.some(i=>i.severity==='cosmetic');
  const low=fuel!=null&&fuel<20;
  const svTag=tw?(function(){const e=worstServiceEngine(u).engine;return e?(engName(u,e)+' '):'';})():'';
  if(sv.state==='over')reasons.push({t:(svTag?(svTag+'over'):'Over')+' service '+Math.abs(sv.remaining)+'h',cls:'bad'});
  else if(sv.state==='soon')reasons.push({t:svTag+sv.remaining+'h to service',cls:'warn'});
  if(low)reasons.push({t:'Fuel '+fuel+'%',cls:'warn'});
  de.forEach(e=>reasons.push({t:engName(u,e)+' down',cls:'bad'}));
  oi.forEach(i=>reasons.push({t:((tw&&i.engine)?(engName(u,i.engine)+' · '):'')+(i.title||i.severity),cls:i.severity==='cosmetic'?'warn':'bad'}));
  /* Half-down must not read as fully dead: attribute the engine when they disagree. */
  if(down)return{color:'red',label:(de.length&&de.length<ENG.length)?(engName(u,de[0]).toUpperCase()+' DOWN'):'DOWN',reasons};
  if(sv.state==='over')return{color:'orange',label:'OVER SERVICE',reasons};
  if(maint)return{color:'orange',label:'NEEDS SERVICE',reasons};
  if(low)return{color:'orange',label:'LOW FUEL',reasons};
  if(sv.state==='soon')return{color:'orange',label:'SERVICE SOON',reasons};
  if(cosm)return{color:'yellow',label:'COSMETIC',reasons};
  if(u.locationType==='transit')return{color:'blue',label:'IN TRANSIT',reasons};
  if(st==='running')return{color:'green',label:'RUNNING',reasons};
  return{color:'grey',label:'STAGED',reasons};
}
/* The badge is the union of the four alert sections, by construction — so the number
   on the tab can never disagree with what you find when you open it. */
function needsAttention(u){return isHardDown(u)||needsService(u)||lowFuel(u)||isStale(u);}
/* ===== JOB HEALTH ===== */
function jobHealth(s){const us=unitsOnShow(s.id);let down=0,overdue=0,last=0;us.forEach(u=>{if(computeStatus(u).color==='red')down++;if(isStale(u))overdue++;});

  return{units:us.length,down,overdue,last};}

function jm(u,sid){return (u.jobMeta&&sid&&u.jobMeta[sid])?u.jobMeta[sid]:{};}

/* ===== SWIPE-TO-REVEAL (job asset cards) ===== */
let _swEl=null,_swX=0,_swY=0,_swBase=0,_swDx=0,_swDir=null;
function swStart(e,el){if(e.target&&e.target.closest&&e.target.closest('button,a')){_swEl=null;return;}_swEl=el;_swX=e.clientX;_swY=e.clientY;_swBase=el.classList.contains('open')?-120:0;_swDx=_swBase;_swDir=null;el.style.transition='none';try{el.setPointerCapture(e.pointerId);}catch(_){}}
function swMove(e,el){if(_swEl!==el)return;const dx=e.clientX-_swX,dy=e.clientY-_swY;if(_swDir===null){if(Math.abs(dx)<4&&Math.abs(dy)<4)return;_swDir=Math.abs(dx)>Math.abs(dy)?'h':'v';if(_swDir==='v'){el.style.transition='transform .2s';el.style.transform='translateX('+_swBase+'px)';_swEl=null;return;}}

function closeSwipe(btn){const w=btn.closest('.swipe-wrap');if(!w)return;const c=w.querySelector('.swipe-card');if(c){c.style.transition='transform .2s';c.style.transform='translateX(0)';c.classList.remove('open');}}
function jbEnd(e,el,showId){if(_swEl!==el)return;_swEl=null;el.style.transition='transform .2s';const dragged=Math.abs(_swDx-_swBase)>8;if(!dragged){const wasOpen=_swBase<0;el.style.transform='translateX(0)';el.classList.remove('open');if(!wasOpen)openJob(showId);return;}if(_swDx>=60){el.style.transform='translateX(0)';el.classList.remove('open');showJobOnMap(showId);return;}if(_swDx<=-60){el.style.transform='translateX(-120px)';el.classList.add('open');return;}el.style.transform='translateX(0)';el.classList.remove('open');}
function confirmDeleteJob(id){const s=showById(id);if(!s)return;const n=S.units.filter(u=>u.locationType==='show'&&u.locationId===id).length;if(n>0){toast(n+' unit'+(n>1?'s':'')+' still on this job. Move them off first');return;}if(!confirm('Delete the job "'+s.name+'"? This cannot be undone.'))return;S.shows=S.shows.filter(x=>x.id!==id);if(S.currentShowId===id)S.currentShowId=(S.shows[0]&&S.shows[0].id)||null;save();render();toast('Job deleted');}
/* ===== FILTERS ===== */

function byKva(a,b){const dn=u=>computeStatus(u).color==='red'?1:0;const da=dn(a),db=dn(b);if(da!==db)return da-db;const kv=v=>{if(v===null||v===undefined||v==='')return Infinity;const n=Number(v);return Number.isFinite(n)?n:Infinity;};const x=kv(a.kw),y=kv(b.kw);if(x!==y)return x-y;

function compressImage(file,cb){const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;const max=1024;if(w>h&&w>max){h=Math.round(h*max/w);w=max;}else if(h>=w&&h>max){w=Math.round(w*max/h);h=max;}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);try{cb(c.toDataURL('image/jpeg',0.55));}catch(e){toast('Could not process image');}};img.onerror=()=>toast('Bad image');img.src=rd.result;};rd.readAsDataURL(file);}

function isDataURI(p){return typeof p==='string'&&p.slice(0,5)==='data:';}
function dataURItoBlob(d){const i=d.indexOf(',');const mime=(d.slice(0,i).match(/data:(.*?)(;|$)/)||[])[1]||'image/jpeg';const bin=atob(d.slice(i+1));const arr=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)arr[k]=bin.charCodeAt(k);return new Blob([arr],{type:mime});}

   hanging uploads accumulate across flush passes and the cap only bounds launches,
   not concurrent in-flight requests. Known, accepted edge (same bucket as orphan
   debt, NOT a bug to rediscover): an upload that times out client-side but lands
   server-side anyway orphans a Storage object, and the retry uploads a duplicate
   under a fresh uid path. Rows only ever reference the copy that acked in time. */
async function syncPendingPhotos(){const jobs=[];S.units.forEach(o=>{(o.photos||[]).forEach((p,i)=>{if(isDataURI(p))jobs.push({o,i,path:'units/'+o.id+'/'+now()+'-'+uid()+'.jpg'});});});S.issues.forEach(o=>{(o.photos||[]).forEach((p,i)=>{if(isDataURI(p))jobs.push({o,i,path:'issues/'+o.id+'/'+now()+'-'+uid()+'.jpg'});});});S.movements.forEach(o=>{(o.photos||[]).forEach((p,i)=>{if(isDataURI(p))jobs.push({o,i,path:'movements/'+o.id+'/'+now()+'-'+uid()+'.jpg'});});});

      const {error}=await Promise.race([up,new Promise((_,rej)=>{tm=setTimeout(()=>{if(ctl)ctl.abort();rej(new Error('timeout'));},PHOTO_UPLOAD_MS);})]);

/* Identity header — pinned to the top of every check form, all units. Answers

   tap. On a TwinPak it also answers WHICH ENGINE, which the form used to drop

   REFERENCE that lets the hours input stay blank: reference visible, value
   observed. */
/* The header pairs a number with a person and a timestamp, so all three must come
   from the SAME observation — otherwise it attributes a reading to someone who
   never took it. Returns the source row when a real check supplied the number, and
   falls back to the stored seed only when no check ever did. Mirrors engHours: on a

function lastRecordedHours(u,e){

  if(r)return{hrs:r.engineHours,src:r};

  return{hrs:(u&&u.currentHours!=null)?u.currentHours:null,src:null};}
function identityCard(u,e){

    <div class="muted" style="font-size:12px;margin-top:2px">${esc([u.make,u.model].filter(Boolean).join(' ')||(u.klass==='big'?'Big iron':'Small iron'))}${u.config?(' · '+esc(u.config)):''}</div>
    <div class="between" style="margin-top:8px;align-items:baseline"><span class="lb" style="margin:0">LAST RECORDED</span><span style="font-size:15px;font-weight:600">${hrs!=null?(Number(hrs).toLocaleString()+' h'):'<span class="muted" style="font-size:13px;font-weight:400">No checks yet</span>'}</span></div>

function recentChecksTable(rs){if(!rs||rs.length<2)return '';const cols=rs.slice(0,4);const METR=[['V L-L',r=>r.voltageLL],['Amps L1',r=>r.ampsL1],['Amps L2',r=>r.ampsL2],['Amps L3',r=>r.ampsL3],['Coolant °',r=>r.coolantTemp],['Oil psi',r=>r.oilPressure],['Fuel psi',r=>r.fuelPsi],['Load %',r=>r.loadPct]];const rows=METR.filter(m=>cols.some(r=>m[1](r)!=null));if(!rows.length)return '';const head='<th class="rcm"></th>'+cols.map((r,i)=>`<th>${i===0?'<span class="rcnow">latest</span><br>':''}${esc(fmtAgo(r.timestamp))}<br><span class="rcw">${esc((String(r.techName||'').split(' ')[0])||'—')}</span></th>`).join('');const body=rows.map(m=>{return '<tr><td class="rcm">'+m[0]+'</td>'+cols.map((r,i)=>{const v=m[1](r);if(v==null)return '<td'+(i===0?' class="rclatest"':'')+'><span class="rcna">—</span></td>';let arrow='';if(i===0){const pv=m[1](cols[1]);if(pv!=null&&pv!==v)arrow=' <span class="rcar">'+(v>pv?'▲':'▼')+'</span>';}return '<td'+(i===0?' class="rclatest"':'')+'>'+v+arrow+'</td>';}).join('')+'</tr>';}).join('');return `<div class="card" style="padding:12px 12px 10px;margin-bottom:12px"><div class="between" style="margin-bottom:8px"><span class="lb" style="margin:0">Recent checks</span><span class="muted" style="font-size:10px">newest → older · ▲▼ vs last</span></div><div style="overflow-x:auto;-webkit-overflow-scrolling:touch"><table class="rc"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div></div>`;}

function saveUnit(id){let ser=$('#f_serial').value.trim().toUpperCase();let tag=$('#f_tag').value.trim().toUpperCase();if(!ser&&!tag){ser='GEN-'+now().toString(36).slice(-5).toUpperCase();}const norm=x=>String(x||'').trim().toLowerCase();const clash=S.units.find(u=>{if(u.id===id)return false;const us=norm(u.serial),ut=norm(u.tagId);return (ser&&(us===norm(ser)||ut===norm(ser)))||(tag&&(us===norm(tag)||ut===norm(tag)));});if(clash){toast('That serial/code is already in the fleet. Search for it to move it onto this job.');return;}

function confirmDeleteUnit(id){const u=unitById(id);if(!u)return;const nR=S.reports.filter(r=>r.unitId===id).length,nI=S.issues.filter(i=>i.unitId===id).length,nM=S.movements.filter(m=>m.unitId===id).length;const nP=(u.photos?u.photos.length:0)+S.issues.filter(i=>i.unitId===id).reduce((n,i)=>n+((i.photos&&i.photos.length)||0),0);const bits=[nR+' check'+(nR===1?'':'s'),nI+' issue'+(nI===1?'':'s'),nM+' movement'+(nM===1?'':'s')];if(nP)bits.push(nP+' photo'+(nP===1?'':'s'));sheet('Delete from fleet',`<div class="banner" style="background:rgba(217,88,79,.14);border-color:rgba(217,88,79,.42)">⚠️ <b>#${esc(u.serial||u.tagId||'asset')}</b> · ${esc([u.make,u.model].filter(Boolean).join(' ')||'asset')}<br><span class="muted">now at ${esc(whereIs(u))}</span></div><p style="margin:13px 0 4px">This permanently removes the asset <b>and its entire history</b>, for everyone on the team:</p><p style="margin:0 0 12px;font-family:var(--mono);font-size:13px;color:var(--red)">${bits.join(' · ')}</p><p class="muted" style="font-size:12.5px;margin:0 0 12px">Just taking it off a job? Swipe it left on the job screen and choose <b>Off job</b>. That keeps the record.</p><label class="fld"><span class="lb">Type DELETE to confirm</span><input id="del_confirm" placeholder="DELETE" autocapitalize="characters" autocorrect="off" spellcheck="false" style="text-transform:uppercase" oninput="delGate()"/></label><button id="del_btn" class="btn danger block" style="opacity:.4;pointer-events:none" onclick="doDeleteUnit('${id}')">Delete permanently</button><button class="btn ghost block" style="margin-top:9px" onclick="closeSheet()">Cancel</button>`);setTimeout(()=>{const e=$('#del_confirm');if(e)e.focus();},140);}

/* ===== SHOWS / SHOPS / MORE / SETTINGS ===== */
let venueSite=null,venueMap=null,venueMarker=null;
function initVenuePicker(){const el=$('#venuePicker');if(!el||typeof L==='undefined')return;if(venueMap){try{venueMap.remove();}catch(e){}venueMap=null;}venueMarker=null;const st=venueSite||{lat:39.5,lng:-98.35,zoom:4};venueMap=L.map(el,{attributionControl:false}).setView([st.lat,st.lng],venueSite?(venueSite.zoom||14):4);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(venueMap);if(venueSite)setVenueMarker(venueSite.lat,venueSite.lng);venueMap.on('click',e=>setVenueMarker(e.latlng.lat,e.latlng.lng));setTimeout(()=>{try{venueMap.invalidateSize();}catch(e){}},250);}
function setVenueMarker(lat,lng){if(!venueMap)return;if(venueMarker)venueMarker.setLatLng([lat,lng]);else venueMarker=L.circleMarker([lat,lng],{radius:10,color:'#fff',weight:3,fillColor:'#c77455',fillOpacity:.95}).addTo(venueMap);const z=venueMap.getZoom();venueSite={lat:+(+lat).toFixed(6),lng:+(+lng).toFixed(6),zoom:z<12?15:z};const r=$('#venueReadout');if(r)r.textContent='✓ Venue set ('+venueSite.lat+', '+venueSite.lng+')';}
function venueUseGPS(){const r=$('#venueReadout');if(r)r.textContent='Locating…';captureGPS(g=>{if(!g){if(r)r.textContent='Location unavailable. Drop a pin or search instead.';return;}if(venueMap)venueMap.setView([g.lat,g.lng],16);setVenueMarker(g.lat,g.lng);});}
function venueSearch(){const q=$('#sh_venueSearch')&&$('#sh_venueSearch').value.trim();if(!q)return;const r=$('#venueReadout');if(r)r.textContent='Searching…';try{fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q)).then(x=>x.json()).then(a=>{if(a&&a.length){const lat=+a[0].lat,lng=+a[0].lon;if(venueMap)venueMap.setView([lat,lng],15);setVenueMarker(lat,lng);}else{if(r)r.textContent='No match. Drop a pin on the map instead.';}}).catch(()=>{if(r)r.textContent='Search unavailable here. Use My location or drop a pin.';});}catch(e){if(r)r.textContent='Search unavailable here. Use My location or drop a pin.';}}
function editShow(id){const s=id?showById(id):{};venueSite=s.site?{lat:s.site.lat,lng:s.site.lng,zoom:s.site.zoom}:null;sheet(id?'Edit job':'New job',`<label class="fld"><span class="lb">Show / event name *</span><input id="sh_name" value="${esc(s.name||'')}" placeholder="Desert Sound Fest 2026"/></label><label class="fld"><span class="lb">Location</span><input id="sh_loc" value="${esc(s.location||'')}" placeholder="City, venue"/></label><label class="fld"><span class="lb">Start date</span><input id="sh_start" type="date" value="${esc(s.startDate||'')}"/></label><div class="lb" style="margin:4px 0 6px">Venue location (optional). Centers the map</div><div class="row" style="margin-bottom:8px"><input id="sh_venueSearch" placeholder="Search e.g. Wrigley Field"/><button type="button" class="btn dark" onclick="venueSearch()">Find</button></div><button type="button" class="btn ghost block" style="margin-bottom:8px" onclick="venueUseGPS()">📍 Use my current location</button><div id="venuePicker" style="height:200px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface2)"></div><p class="muted" id="venueReadout" style="font-size:12px;margin:6px 0 12px">${venueSite?('✓ Venue set ('+venueSite.lat+', '+venueSite.lng+')'):'Tap the map to drop a pin, or search / use your location.'}</p><button class="btn primary block" onclick="saveShow('${id||''}')">${id?'Save':'Create job'}</button>`);setTimeout(initVenuePicker,160);}
function saveShow(id){const nm=$('#sh_name').value.trim();if(!nm){toast('Name required');return;}let s=id?showById(id):null;if(!s){s={id:uid('show'),createdAt:now()};S.shows.push(s);}s.name=nm;s.location=$('#sh_loc').value.trim();s.startDate=$('#sh_start').value||null;s.site=venueSite||null;S.currentShowId=s.id;save();closeSheet();openJob(s.id);toast('Job ready');}
function openMore(){sheet('More',`<button class="btn ghost block" style="margin-bottom:9px" onclick="openTestQR()">Make a test QR code</button><button class="btn ghost block" onclick="openSettings()">Settings</button>`);}
function openShops(){const rows=S.shops.map(sh=>{const us=S.units.filter(u=>u.locationType==='shop'&&u.locationId===sh.id);return `<div class="listitem"><div class="between"><b>${esc(sh.name)}</b><span class="chip">${us.length} on hand</span></div>${us.length?`<div class="muted" style="font-size:12px;margin-top:5px">${us.map(u=>'#'+esc(u.serial||u.tagId)).join(', ')}</div>`:''}</div>`;}).join('');sheet('Shops',`<p class="muted" style="margin-top:0">A unit's location is wherever it was last scanned.</p><div class="card">${rows}</div><button class="btn ghost block" style="margin-top:12px" onclick="addShop()">+ Add shop</button>`);}
function addShop(){const n=prompt('Shop name');if(n&&n.trim()){S.shops.push({id:uid('shop'),name:n.trim()});save();openShops();}}
function openServicePlanner(){const list=S.units.filter(u=>serviceState(u).state!=='unknown').sort((a,b)=>serviceState(a).remaining-serviceState(b).remaining);sheet('Service planner',`<p class="muted" style="margin-top:0">Units by runtime left before service. Put fresh units on long runs, near-service units on short runs.</p><div class="card" style="padding:4px 0">${list.length?list.map(u=>{const sv=serviceState(u);const cls=sv.state==='over'?'bad':(sv.state==='soon'?'warn':'ok');return `<div class="listitem" style="cursor:pointer;display:flex;align-items:center;gap:10px" onclick="openUnit('${u.id}')"><div style="flex:1;min-width:0"><b>#${esc(u.serial||u.tagId)}</b> <span class="muted" style="font-size:12px">${esc([u.make,u.model].filter(Boolean).join(' '))}</span><div class="muted" style="font-size:11px">${u.currentHours??'?'}h now · at ${whereIs(u)}</div></div><span class="chip ${cls}">${sv.remaining<=0?('OVER '+Math.abs(sv.remaining)+'h'):(sv.remaining+'h')}</span></div>`;}).join(''):'<div class="empty"><p class="muted">No service info yet.</p></div>'}</div>`);}
function openTestQR(){sheet('Make a test QR code',`<p class="muted" style="margin-top:0">Type any code, show this on another screen, and scan it to try the flow.</p><label class="fld"><span class="lb">Code text</span><div class="row"><input id="qrText" value="GEN-TEST-01"/><button class="btn dark" onclick="genQR()">Make</button></div></label><div class="qrbox"><div id="qrOut"></div></div>`);setTimeout(genQR,150);}
function genQR(){const el=$('#qrOut');if(!el)return;el.innerHTML='';if(typeof QRCode==='undefined'){el.textContent='QR lib not loaded';return;}new QRCode(el,{text:($('#qrText').value||'GEN-TEST-01'),width:200,height:200});}
function openSettings(){sheet('Settings',`<label class="fld"><span class="lb">Your name</span><input id="set_tech" value="${esc(S.settings.techName||'')}"/></label><div class="grid2"><label class="fld"><span class="lb">Service warn (hrs)</span><input id="set_warn" type="number" inputmode="decimal" value="${S.settings.warnHours||20}"/></label><label class="fld"><span class="lb">Stale check (hrs)</span><input id="set_stale" type="number" inputmode="decimal" value="${S.settings.staleHours||6}"/></label></div><label class="fld"><span class="lb">Service dept email</span><input id="set_email" value="${esc(S.settings.svcEmail||'')}"/></label><label class="fld"><span class="lb">Home screen</span><div class="segwrap" id="home_seg"><button type="button" data-v="jobs" class="${S.settings.homeTab!=='fleet'?'on':''}" style="${S.settings.homeTab!=='fleet'?'background:var(--accent);color:#fff':''}" onclick="homeSeg(this)">Jobs</button><button type="button" data-v="fleet" class="${S.settings.homeTab==='fleet'?'on':''}" style="${S.settings.homeTab==='fleet'?'background:var(--accent);color:#fff':''}" onclick="homeSeg(this)">Fleet</button></div></label><label class="fld"><span class="lb">Jobs icon</span><select id="set_icon">${[['jobs','Calendar'],['pin','Location flag'],['map','Map'],['bolt','Bolt'],['fleet','Grid']].map(([v,l])=>`<option value="${v}" ${S.settings.jobIcon===v?'selected':''}>${l}</option>`).join('')}</select></label><button class="btn primary block" onclick="saveSettings()">Save</button><hr class="sep"/><div class="lb" style="margin-bottom:6px">ACCOUNT</div><p class="muted" style="font-size:12px;margin-top:0">Signed in as <b>${esc((USER&&USER.email)||'—')}</b>. Your fleet data is shared live with your team.</p><div class="row"><button class="btn dark wide" onclick="exportData()">Export backup</button><button class="btn ghost wide" onclick="doSignOut()">Sign out</button></div>${S.shows.some(s=>(s.name||'').startsWith('DEMO'))?'<hr class="sep"/><div class="lb" style="margin-bottom:6px">Leftover demo data</div><p class="muted" style="font-size:12px;margin-top:0">Test units from the demo are still in the shared fleet.</p><button class="btn ghost block" onclick="removeSampleData()">Remove demo data</button>':''}<p class="muted" style="font-size:11px;margin-top:14px">FleetView · Team mode · live shared data.</p>`,stopScanner);homeSegVal=S.settings.homeTab||'jobs';}
let homeSegVal='jobs';function homeSeg(b){homeSegVal=b.dataset.v;document.querySelectorAll('#home_seg button').forEach(x=>{x.classList.remove('on');x.style.background='';x.style.color='';});b.classList.add('on');b.style.background='var(--accent)';b.style.color='#fff';}
function saveSettings(){S.settings.techName=$('#set_tech').value.trim();try{sb.auth.updateUser({data:{name:S.settings.techName}});}catch(e){}S.settings.warnHours=num($('#set_warn').value)||20;S.settings.staleHours=num($('#set_stale').value)||6;S.settings.svcEmail=$('#set_email').value.trim();S.settings.homeTab=homeSegVal;S.settings.jobIcon=$('#set_icon').value;save();closeSheet();toast('Saved');render();}
function exportData(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='fleetview-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();}
function importData(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{S=JSON.parse(rd.result);save();closeSheet();go(S.settings.homeTab==='fleet'?'fleet':'jobs');toast('Imported');}catch(e){toast('Invalid file');}};rd.readAsText(f);}
function wipe(){if(!confirm('Erase everything?'))return;S=blankState();save();closeSheet();go('jobs');}
/* ===== SHEET ===== */
let onSheetClose=null;
function sheet(title,html,onClose,noPad){onSheetClose=onClose||null;$('#sheet').innerHTML=`<div class="sh-top"><h3>${esc(title)}</h3><button class="closex" onclick="closeSheet()">✕</button></div><div class="sh-body" ${noPad?'style="padding-top:14px"':''}>${html}</div>`;$('#overlay').classList.add('on');}
function closeSheet(){if(onSheetClose){try{onSheetClose();}catch(e){}onSheetClose=null;}$('#overlay').classList.remove('on');render();}
/* ===== SERVICE WORKER (tap-to-update; kill switch lives in sw.js) ===== */
let swReg=null,swReloaded=false;
function initSW(){if(!('serviceWorker' in navigator)||location.protocol!=='https:')return;
  navigator.serviceWorker.register('sw.js').then(reg=>{swReg=reg;
    if(reg.waiting)swUpdateReady();
    reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(!nw)return;
      nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)swUpdateReady();});});
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(swReloaded)return;swReloaded=true;location.reload();});}
function swUpdateReady(){const b=$('#updateBar');if(b)b.style.display='';}
function applySwUpdate(){if(swReg&&swReg.waiting)swReg.waiting.postMessage('SKIP_WAITING');const b=$('#updateBar');if(b)b.style.display='none';}
/* ===== THEME ===== */
function applyTheme(){const t=(S.settings&&S.settings.theme==='light')?'light':'dark';document.documentElement.setAttribute('data-theme',t);const b=$('#themeBtn');if(b)b.textContent=t==='light'?'🌙':'☀️';const m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',t==='light'?'#fffdf7':'#191714');}
function toggleTheme(){S.settings.theme=(S.settings.theme==='light')?'dark':'light';save();applyTheme();toast(S.settings.theme==='light'?'☀️ Daylight':'🌙 Dark');}
/* ===== DEMO ===== */

/* ===== SAMPLE DATA (testing) ===== */

function removeSampleData(){const ids=new Set(S.shows.filter(s=>(s.name||'').startsWith('DEMO')).map(s=>s.id));if(!ids.size){toast('No sample data found');return;}const uids=new Set(S.units.filter(u=>ids.has(u.locationId)||ids.has(u.inTransitToShowId)).map(u=>u.id));S.units=S.units.filter(u=>!uids.has(u.id));S.reports=S.reports.filter(r=>!uids.has(r.unitId));S.issues=S.issues.filter(i=>!uids.has(i.unitId));S.movements=S.movements.filter(m=>!uids.has(m.unitId));S.shows=S.shows.filter(s=>!ids.has(s.id));if(ids.has(S.currentShowId))S.currentShowId=null;save();closeSheet();go('jobs');toast('Sample data removed');}

/* ===== INIT ===== */
buildNav();$('#logoIc').innerHTML=IC.bolt;$('#fabScan').innerHTML=IC.plus+'<span>Add</span>';var _al=$('#au_logo');if(_al)_al.innerHTML=IC.bolt;
loadSettings();applyTheme();initSW();
try{sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT')showAuth();});}catch(e){}
(async function init(){try{await boot();}catch(e){showAuth();authMsg('Connection problem. Check your network and retry.');}})();
</script>
