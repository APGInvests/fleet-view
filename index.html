<!DOCTYPE html>
<html lang="en">

<link rel="manifest" href="manifest.json" />

<meta name="apple-mobile-web-app-capable" content="yes" />

<title>FleetView — Generator Fleet Tracker</title>
<!-- fleetview build 2026-08-11 deps-pin-sri -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600;1,700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<!-- Every CDN tag: exact version pin + SRI + crossorigin (build deps-pin-sri).
     supabase-js was a floating @2 — with the SW's cache-first CDN policy that meant
     different phones could run different library versions depending on when each
     first cached it. Pinned 2.112.3 is byte-identical to what @2 served at pin time.
     Google Fonts CSS carries no SRI: its response varies per user-agent, unhashable.
     Guarded by tools/fv_inv_head.js. -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" integrity="sha384-pmjIAcz2bAn0xukfxADbZIb3t8oRT9Sv0rvO+BR5Csr6Dhqq+nZs59P0pPKQJkEV" crossorigin="anonymous" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" integrity="sha384-wgw+aLYNQ7dlhK47ZPK7FRACiq7ROZwgFNg0m04avm4CaXS+Z9Y7nMu8yNjBKYC+" crossorigin="anonymous" />
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" integrity="sha384-eXVCORTRlv4FUUgS/xmOyr66XBVraen8ATNLMESp92FKXLAMiKkerixTiBvXriZr" crossorigin="anonymous"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" integrity="sha384-c9d8RFSL+u3exBOJ4Yp3HUJXS4znl9f+z66d1y54ig+ea249SpqR+w1wyvXz/lk+" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha384-3zSEDfvllQohrq0PHL1fOXJuC/jSOO34H46t6UQfobFOmxE5BpjjaIJY5F2/bMnU" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.min.js" integrity="sha384-l8ah+VgaWtk1mvOe9VC+OirC6qHFF4yH7l7mKRidV9MSti3E9F463bMp6ZVN4kuC" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#191714; --card:#221f1b; --surface2:#2b2723; --ink:#efe7d9; --ink2:#a99e8f; --line:#38332c;
    --accent:#c77455; --accent-ink:#191714;
    --green:#4fae7a; --yellow:#e0b23f; --orange:#e2823f; --red:#dc5142; --grey:#8a8175; --blue:#6b93d6;
    --serif:'Playfair Display',Georgia,'Times New Roman',serif;
    --mono:'Space Mono','SFMono-Regular',Menlo,Consolas,monospace;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 34px rgba(0,0,0,.4);
    --radius:14px;
    --topbar-bg:#1c1915; --showbar-bg:#211d18; --input-bg:#211d18;
    --chip-bg:#241f1a; --chip-ink:#b7ac9b;
    --btn-dark-bg:#efe7d9; --btn-dark-ink:#1c1510;
    --banner-bg:#2a2016; --banner-line:#4d3b24; --banner-ink:#e7c48f;
  }
  :root[data-theme="light"]{
    --bg:#f4eee3; --card:#fffdf7; --surface2:#ece4d6; --ink:#211e19; --ink2:#857b6b; --line:#e3dacb;
    --accent:#bd5f45;
    --green:#1f9d57; --yellow:#c98f14; --orange:#cf6420; --red:#c5302a; --grey:#8a8073; --blue:#2f6fd0;
    --shadow:0 1px 2px rgba(60,45,25,.07),0 12px 30px rgba(60,45,25,.10);
    --topbar-bg:#fffdf7; --showbar-bg:#efe8db; --input-bg:#fffdf7;
    --chip-bg:#ece4d5; --chip-ink:#6d6455;
    --btn-dark-bg:#211e19; --btn-dark-ink:#f5efe5;
    --banner-bg:#f7ecd7; --banner-line:#e6cfa0; --banner-ink:#8a5a12;
  }
  :root[data-theme="light"] .chip.warn{background:#f7ecd7;color:#8a5a12;border-color:#e6cfa0}
  :root[data-theme="light"] .chip.bad{background:#f7dcd8;color:#a3271f;border-color:#e9b3ac}
  :root[data-theme="light"] .chip.ok{background:#dff0e4;color:#1c7a45;border-color:#b6ddc2}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--serif);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
  .barlow{font-family:var(--serif);font-weight:700}
  .wrap{max-width:680px;margin:0 auto;padding:0 16px}
  header.top{position:sticky;top:0;z-index:40;background:var(--topbar-bg);color:var(--ink);padding:calc(env(safe-area-inset-top) + 10px) 0 10px;box-shadow:0 1px 0 var(--line),0 3px 16px rgba(0,0,0,.42)}
  .top .wrap{display:flex;align-items:center;gap:10px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700}
  .brand .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
  .brand .logo svg{width:18px;height:18px;color:#fff}
  .brand b{font-family:var(--serif);font-size:23px;letter-spacing:.3px;line-height:1;font-weight:700}
  .brand small{display:block;font-family:var(--mono);font-size:9.5px;color:var(--ink2);font-weight:400;letter-spacing:2px;text-transform:uppercase;margin-top:2px}
  .top .spacer{flex:1}
  .iconbtn{background:transparent;border:1px solid var(--line);color:var(--ink);width:38px;height:38px;border-radius:10px;font-size:18px;cursor:pointer;display:grid;place-items:center}
  .iconbtn:active{transform:scale(.95)}
  .showbar{background:var(--showbar-bg);border-top:1px solid var(--line)}
  .showbar .wrap{display:flex;align-items:center;gap:10px;padding-top:8px;padding-bottom:8px}
  .showchip{flex:1;display:flex;align-items:center;gap:10px;background:var(--chip-bg);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600}
  .showchip .ji{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;flex:0 0 26px}
  .showchip .ji svg{width:15px;height:15px;color:#fff}
  .showchip .nm{font-size:16px;font-family:var(--serif);line-height:1.1}
  .showchip .sub{font-family:var(--mono);font-size:10px;color:var(--ink2);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
  .showchip .car{margin-left:auto;color:var(--ink2)}
  main{padding-top:16px;min-height:60vh}
  h2.section{font-family:var(--serif);font-size:27px;margin:6px 0 12px;letter-spacing:0;font-weight:700;color:var(--ink)}
  h2.section.sm{font-size:19px}
  .muted{color:var(--ink2)}
  .row{display:flex;gap:10px;align-items:center}
  .between{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .unit{display:flex;gap:0;margin-bottom:11px;overflow:hidden;cursor:pointer}
  .swipe-wrap{position:relative;overflow:hidden;border-radius:14px;margin-bottom:11px}
  .swipe-actions{position:absolute;top:0;right:0;bottom:0;display:flex;z-index:0}
  .swipe-act{border:none;color:#fff;font-weight:700;font-size:13px;width:120px;display:grid;place-items:center;cursor:pointer;font-family:var(--mono);letter-spacing:.3px}
  .swipe-act.off{background:var(--blue)}
  .swipe-maphint{position:absolute;left:0;top:0;bottom:0;width:120px;display:grid;place-items:center;background:var(--green);color:#fff;font-family:var(--mono);font-weight:700;font-size:13px;z-index:0}
  .swipe-act.del{background:var(--red)}
  .swipe-card{position:relative;z-index:1;transition:transform .2s ease;will-change:transform;touch-action:pan-y}
  .swipe-card.unit,.swipe-card.jobrow{margin-bottom:0}
  .unit .stripe{width:8px;flex:0 0 8px}
  .unit .body{flex:1;padding:12px 14px;min-width:0}
  .unit .body .l1{display:flex;align-items:center;gap:8px}
  .unit .tag{font-family:var(--serif);font-size:20px;font-weight:700;letter-spacing:.3px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .uloc{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);margin-top:5px}
  .uloc svg{width:15px;height:15px;flex:0 0 15px}
  .uloc.bad{color:var(--red)} .uloc.transit{color:var(--blue)}
  .pill{font-family:var(--mono);font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px;color:#fff;white-space:nowrap;text-transform:uppercase;letter-spacing:.5px}
  .fuel{display:flex;align-items:center;gap:9px;margin-top:10px}
  .fuel .fl{font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--ink2)}
  .fuel .track{flex:1;height:7px;border-radius:6px;background:var(--surface2);overflow:hidden}
  .fuel .fill{height:100%;border-radius:6px}
  .fuel .pct{font-family:var(--mono);font-size:12px;font-weight:700;min-width:38px;text-align:right}
  .chip{font-family:var(--mono);font-size:10.5px;font-weight:400;padding:3px 8px;border-radius:8px;background:var(--chip-bg);color:var(--chip-ink);border:1px solid var(--line);white-space:nowrap}
  .chip.warn{background:#33271a;color:#e6ab5c;border-color:#5a4327}
  .chip.bad{background:#331e1b;color:#ec8a7e;border-color:#5a2f2a}
  .chip.ok{background:#1e2a22;color:#79c79b;border-color:#2f4a3a}
  .metaline{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;align-items:center}
  .fresh{font-family:var(--mono);font-size:11px;color:var(--ink2);display:flex;align-items:center;gap:5px}
  .fresh.stale{color:var(--orange)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;padding:13px 16px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--mono);letter-spacing:.3px;background:var(--surface2);color:var(--ink)}
  .btn:active{transform:translateY(1px)}
  .btn svg{width:17px;height:17px}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.dark{background:var(--btn-dark-bg);color:var(--btn-dark-ink)}
  .btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
  .btn.danger{background:var(--red);color:#fff}
  .btn.sm{padding:9px 12px;font-size:12px;border-radius:10px}
  .btn.block{width:100%}
  .btn.wide{flex:1}
  .fab-scan{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:45;width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;display:grid;place-items:center;box-shadow:0 8px 20px rgba(199,116,85,.5)}
  .fab-scan svg{width:26px;height:26px}
  .fab-scan span{position:absolute;bottom:-16px;font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--accent)}
  nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:44;background:var(--topbar-bg);border-top:1px solid var(--line);box-shadow:0 -2px 16px rgba(0,0,0,.42);padding-bottom:env(safe-area-inset-bottom)}
  nav.bottom .inner{max-width:680px;margin:0 auto;display:flex}
  nav.bottom button{flex:1;background:none;border:none;padding:10px 2px 9px;cursor:pointer;color:var(--ink2);font-size:9.5px;font-weight:700;font-family:var(--mono);text-transform:uppercase;letter-spacing:1px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
  nav.bottom button svg{width:23px;height:23px}
  nav.bottom button.active{color:var(--accent)}
  .navbadge{position:absolute;top:4px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:none;align-items:center;justify-content:center;line-height:1}
  .navbadge.on{display:flex}
  label.fld,div.fld{display:block;margin:0 0 12px}
  label.fld .lb,div.fld .lb{display:block;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
  input,select,textarea{width:100%;font-family:var(--mono);font-size:16px;padding:12px 13px;border:1.5px solid var(--line);border-radius:11px;background:var(--input-bg);color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  textarea{resize:vertical;min-height:70px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .calwrap{border:1.5px solid var(--line);border-radius:11px;background:var(--surface2);padding:10px}
  .calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .calhead b{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:1px}
  .calhead button{border:none;background:none;color:var(--ink2);font-size:19px;line-height:1;padding:2px 12px;cursor:pointer}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .calgrid .dow{text-align:center;font-family:var(--mono);font-size:9px;color:var(--ink2);text-transform:uppercase;padding-bottom:2px}
  .calgrid button{border:none;border-radius:8px;background:none;color:var(--ink);font-family:var(--mono);font-size:12.5px;padding:8px 0;cursor:pointer}
  .calgrid button.on{background:var(--accent);color:#fff;font-weight:700}
  .evday{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--mono);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--accent);margin:15px 2px 5px;padding-bottom:4px;border-bottom:1px solid var(--line)}
  .evday span{color:var(--ink2);font-weight:400;letter-spacing:.3px;text-transform:none;white-space:nowrap}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .searchbar{display:flex;align-items:center;gap:9px;background:var(--input-bg);border:1.5px solid var(--line);border-radius:11px;padding:0 12px;margin-bottom:12px}
  .searchbar svg{width:17px;height:17px;color:var(--ink2);flex:0 0 17px}
  .searchbar input{border:none;background:none;padding:11px 0}
  .filterbar{display:flex;gap:7px;margin-bottom:13px;overflow:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .fchip{white-space:nowrap;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink2);padding:7px 13px;border-radius:999px;font-weight:700;font-size:11px;cursor:pointer;font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px}
  .fchip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .fchip.on.down{background:var(--red);border-color:var(--red)}
  .overlay{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.62);display:none;align-items:flex-end;justify-content:center}
  .overlay.on{display:flex}
  .sheet{background:var(--bg);width:100%;max-width:680px;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:0 0 24px;border-top:1px solid var(--line)}
  .sheet .sh-top{position:sticky;top:0;background:var(--bg);padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);z-index:2}
  .sheet .sh-top h3{margin:0;font-family:var(--serif);font-size:23px;letter-spacing:.2px;flex:1;font-weight:700}
  .sheet .sh-body{padding:16px}
  .closex{background:var(--surface2);border:1px solid var(--line);width:34px;height:34px;border-radius:9px;font-size:18px;cursor:pointer;color:var(--ink2)}
  .stathead{border-radius:var(--radius);padding:16px;color:#fff;box-shadow:var(--shadow)}
  .stathead .big{font-family:var(--serif);font-size:31px;font-weight:700;line-height:1}
  .stathead .sub{opacity:.95;font-size:13px;margin-top:4px;font-family:var(--mono)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
  .kv .k{color:var(--ink2);font-weight:400;font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .sub-tabs{display:flex;gap:6px;margin:14px 0 4px;overflow:auto;-webkit-overflow-scrolling:touch}
  .sub-tabs button{white-space:nowrap;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink2);padding:8px 13px;border-radius:999px;font-weight:700;font-size:11px;cursor:pointer;font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px}
  .sub-tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .empty{text-align:center;padding:40px 16px;color:var(--ink2)}
  .empty .em{font-size:40px;margin-bottom:10px}
  .listitem{padding:12px 14px;border-bottom:1px solid var(--line)}
  .listitem:last-child{border-bottom:none}
  .banner{background:var(--banner-bg);border:1px solid var(--banner-line);color:var(--banner-ink);border-radius:12px;padding:11px 13px;font-size:13px;margin-bottom:14px;line-height:1.45}
  .segwrap{display:flex;gap:0;border:1.5px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface2)}
  .segwrap button{flex:1;border:none;background:var(--surface2);padding:11px 6px;font-weight:700;font-size:12px;cursor:pointer;color:var(--ink2);font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px}
  .segwrap button.on{color:#fff}
  #reader{width:100%;border-radius:12px;overflow:hidden;background:#000;min-height:250px}
  .qrbox{display:grid;place-items:center;padding:14px;background:#fff;border-radius:12px}
  #map{height:62vh;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface2);isolation:isolate}
  /* Map elements must read on BOTH street and aerial imagery — one style that works
     everywhere, not two that each work once. Plugin-default cluster bubbles are
     translucent (inherit the imagery); these overrides make them opaque charcoal
     with white mono counts and a light outer ring. Spiderfy legs are white with a
     dark SVG halo; the venue-picker circle gets the same halo. */
  .marker-cluster-small,.marker-cluster-medium,.marker-cluster-large{background:rgba(255,255,255,.8)}
  .marker-cluster-small div,.marker-cluster-medium div,.marker-cluster-large div{background:rgba(25,23,20,.92);color:#fff;font-family:var(--mono);font-weight:700}
  .spiderleg{filter:drop-shadow(0 0 1.5px rgba(0,0,0,.9))}
  .vmark{filter:drop-shadow(0 0 2px rgba(0,0,0,.8))}
  .leaflet-control-layers label{color:#241d15;font-family:var(--mono);font-size:12px}
  .jobrow{cursor:pointer;padding:15px;margin-bottom:11px}
  .jobrow .jt{font-family:var(--serif);font-size:21px;font-weight:700}
  .jobrow .jsub{font-family:var(--mono);font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
  .jnum{font-family:var(--mono);font-size:12px;font-weight:400;color:var(--ink2);margin-left:7px;letter-spacing:0;white-space:nowrap}
  .jdates{font-family:var(--mono);font-size:11px;color:var(--ink);margin-top:3px}
  .hbar{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
  .hchip{font-family:var(--mono);font-size:11px;font-weight:700;padding:5px 10px;border-radius:8px;display:flex;align-items:center;gap:6px;background:var(--surface2);color:var(--ink2)}
  .hchip .dot{width:8px;height:8px;border-radius:50%}
  .hchip.alarm{background:#331e1b;color:#ec8a7e}
  .hchip.warnh{background:#33271a;color:#e6ab5c}
  .backbtn{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--ink2);font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:1px;cursor:pointer;padding:0;margin-bottom:8px}
  .backbtn svg{width:16px;height:16px}

function incomingToShow(id){return S.units.filter(u=>u.locationType==='transit'&&u.inTransitToShowId===id);}
/* Voided checks (2026-08-10) leave EVERY derived reader here, the one choke
   point — freshness, alerts, fuel, hours, trends, the gauge badge all flow
   through reportsFor. The rows themselves stay in S.reports and in the DB,
   marked voided_at/voided_by: append-only respected, raw data keeps them. */
function reportsFor(id){return S.reports.filter(r=>r.unitId===id&&!r.voidedAt).sort((a,b)=>b.timestamp-a.timestamp);}
function issuesFor(id){return S.issues.filter(i=>i.unitId===id).sort((a,b)=>b.timestamp-a.timestamp);}
function openIssuesFor(id){return issuesFor(id).filter(i=>!i.resolved);}
function lastReport(id){return reportsFor(id)[0]||null;}
function latestFuel(u){const r=reportsFor(u.id).find(r=>r.fuelLevelPct!=null);return r?r.fuelLevelPct:null;}
function lastCheckTs(u){const r=lastReport(u.id);return r?r.timestamp:null;}
/* ===== ALERT PREDICATES — one definition per alert, used by every surface =====
   The Alerts screen, the nav badge and job health all read these, so no surface can
   drift from another. Gating lives HERE rather than in a render filter, because the
   question "does this unit owe me something?" is a property of the unit, not of the
   screen you happen to be on.

   owesCheck: a unit that isn't on a job can't be checked, and a staged unit has
   nothing to observe yet — 20 generators placed in a day, some not running for a
   week, must not nag. So: on a job AND running, then the staleness clock.
   lowFuel: fuel on a staged machine isn't news. Running only.
   isHardDown / needsService: fire regardless of assignment. A machine broken or
   overdue for service in the Jersey shop is precisely what the service department
   needs to see — that's the point of the app. Service won't flood, because a unit
   with blank hours has no countdown at all. */
function onJob(u){return !!u&&u.locationType==='show';}
function owesCheck(u,e){

/* kind:'photo' rows are excluded EXPLICITLY here and in recentDests, even though

   a check: it must never satisfy anything that means "the unit was observed
   here" — not the pin, not recents, not freshness. Same family as rule 1. */
function unitGps(u){let best=null;S.movements.filter(m=>m.unitId===u.id&&m.kind!=='photo').forEach(e=>{if(e.gps&&(!best||e.timestamp>best.ts))best={ts:e.timestamp,g:e.gps};});return best?best.g:null;}

/* ===== ENGINES — true TwinPak: one NES line item, one record, two engines =====

   never breaks history. Hours and status are DERIVED per engine, never merged:

const ENG=['A','B'];

function chassisStatus(u){

  if(!sts.length)return (u&&u.opStatus)||'staged';

function downEngines(u){return isTwin(u)?ENG.filter(e=>engStatus(u,e)==='down'):[];}
function engLastTs(u,e){const r=engReports(u,e)[0];return r?r.timestamp:null;}
function engStale(u,e){return owesCheck(u,e);}
/* Has this engine ever had hours read off ITS OWN meter? Inherited pre-split hours

   consistent, not correct. Until each engine has its own observed reading, its
   countdown is running against a number nobody attributed to it — the same freeze

   binding pass is visible from the Fleet list without opening anything. */
function engNeedsReading(u,e){if(!isTwin(u)||!e)return false;

function twinGaps(u){return isTwin(u)?ENG.filter(e=>engNeedsReading(u,e)):[];}

   It records an EVENT, not a silent field set: who, when, what. The model is
   append-only and hours derive from reports, so losing "when did this go down and
   who called it" would be a real loss.

   freshness clock and never enters the hours-derivation path.
   Rule 3: the control starts on the unit's CURRENT status. An engine nobody has

const STATUS_OPTS=[['running','Running','var(--green)'],['staged','Staged','var(--grey)'],['down','Down','var(--red)']];
function statusSeg(u,e){const cur=e?engStatus(u,e):((u&&u.opStatus)||'staged');

/* ===== STATUS ===== */
function svcCalc(due,cur){if(due==null||cur==null)return{state:'unknown',remaining:null};const rem=Math.round((due-cur)*10)/10;if(rem<=0)return{state:'over',remaining:rem};if(rem<=(S.settings.warnHours||20))return{state:'soon',remaining:rem};return{state:'ok',remaining:rem};}

  if(sv.state==='over')reasons.push({t:(svTag?(svTag+'over'):'Over')+' service '+Math.abs(sv.remaining)+'h',cls:'bad'});
  else if(sv.state==='soon')reasons.push({t:svTag+sv.remaining+'h to service',cls:'warn'});

  if(sv.state==='soon')return{color:'orange',label:'SERVICE SOON',reasons};
  if(cosm)return{color:'yellow',label:'COSMETIC',reasons};

  return `<div class="filterbar">${F.map(([k,l])=>`<button class="fchip ${cur===k?'on':''} ${k==='down'?'down':''}" onclick="${fn}('${k}')">${l}</button>`).join('')}</div>`;}
function byKva(a,b){const dn=u=>computeStatus(u).color==='red'?1:0;const da=dn(a),db=dn(b);if(da!==db)return da-db;const kv=v=>{if(v===null||v===undefined||v==='')return Infinity;const n=Number(v);return Number.isFinite(n)?n:Infinity;};const x=kv(a.kw),y=kv(b.kw);if(x!==y)return x-y;

     otherwise the serial. Same-kVA units are indistinguishable by serial alone. */
  const key=z=>{const sid=(z.locationType==='show'&&z.locationId)?z.locationId:S.currentShowId;const m=jm(z,sid);return String((m&&m.name)||z.serial||z.tagId||'');};

/* ===== BASEMAP (street + satellite) =====
   One constructor for every map in the app. Layers, per-layer attribution (the
   control shows only the ACTIVE layer's credit), the USGS maxNativeZoom ceiling,
   and the persistence hook all live here — three duplicated tile configs used to.
   Preference is per-device in S.settings.basemap (same pattern as theme): read at
   init, applied to every instance, flipped by baselayerchange, saved by save().
   USGS Imagery Only is public domain, keyless — settled choice. Empirical cache
   ceiling z16 (probed 2026-08-01 over Grant Park + Hinterland: hard 404 above);
   maxNativeZoom upscales the last real tile instead of blanking. Street keeps 19. */
function basemapPref(){return (S.settings&&S.settings.basemap==='satellite')?'satellite':'street';}
/* NAIP Plus high-zoom overlay — OVERLAY, NOT HANDOFF. NAIP is a live dynamic
   render (exportImage) on shared government compute: no CDN, no SLA. It sits ON
   TOP of the cached z16 imagery, active only at z17+, so when it is slow or down
   the map degrades to the upscaled z16 base we already ship — blurry, never
   blank. The toggle stays two entries; NAIP is an implementation detail of
   Satellite. Per-tile timeout swaps a hung render for a transparent pixel
   (aborting the request) so the base shows through and the browser's per-host
   connection budget is freed. */
const NAIP_TIMEOUT_MS=8000;
const NAIP_BLANK='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
function naipTileUrl(c){const R=20037508.342789244,s=2*R/Math.pow(2,c.z),x0=-R+c.x*s,y1=R-c.y*s,f=v=>v.toFixed(6);

function naipTileTimeout(e){const img=e&&e.tile;if(!img)return;
  setTimeout(()=>{if(!img.complete||!img.naturalWidth)img.src=NAIP_BLANK;},NAIP_TIMEOUT_MS);}
function makeMap(el,opts){const m=L.map(el,Object.assign({attributionControl:true},opts||{}));
  const street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'});
  const sat=L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,maxNativeZoom:16,attribution:'U.S. Geological Survey'});
  const naip=L.tileLayer('',{minZoom:17,maxZoom:19,zIndex:2,attribution:'U.S. Geological Survey'});
  naip.getTileUrl=naipTileUrl;

  if(basemapPref()==='satellite')naip.addTo(m);

function startScanner(){const msg=$('#scanMsg');if(!msg)return;if(typeof Html5Qrcode==='undefined'){msg.innerHTML='Scanner didn\'t load. Type the code below, or “Add manually”.';return;}

let draftPhotos=[];
function compressImage(file,cb){const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;const max=1024;if(w>h&&w>max){h=Math.round(h*max/w);w=max;}else if(h>=w&&h>max){w=Math.round(w*max/h);h=max;}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);try{cb(c.toDataURL('image/jpeg',0.55));}catch(e){toast('Could not process image');}};img.onerror=()=>toast('Bad image');img.src=rd.result;};rd.readAsDataURL(file);}
function persistOrWarn(undo){save();return true;}
/* Photos: capture stores data URIs (works offline); flush() swaps them for Storage
   URLs before rows serialize. Bounded — runs inside flush() with flushing=true, so a
   stalled upload must not hold the lock open (cap per flush + timeout per upload). */
function isDataURI(p){return typeof p==='string'&&p.slice(0,5)==='data:';}
function dataURItoBlob(d){const i=d.indexOf(',');const mime=(d.slice(0,i).match(/data:(.*?)(;|$)/)||[])[1]||'image/jpeg';const bin=atob(d.slice(i+1));const arr=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)arr[k]=bin.charCodeAt(k);return new Blob([arr],{type:mime});}
const PHOTO_FLUSH_CAP=6,PHOTO_UPLOAD_MS=8000;
/* Timeout ABORTS the request (AbortController), not just abandons it — otherwise
   hanging uploads accumulate across flush passes and the cap only bounds launches,
   not concurrent in-flight requests. Known, accepted edge (same bucket as orphan
   debt, NOT a bug to rediscover): an upload that times out client-side but lands
   server-side anyway orphans a Storage object, and the retry uploads a duplicate
   under a fresh uid path. Rows only ever reference the copy that acked in time. */
async function syncPendingPhotos(d){const jobs=[];S.units.forEach(o=>{(o.photos||[]).forEach((p,i)=>{if(isDataURI(p))jobs.push({o,i,t:'units',path:'units/'+o.id+'/'+now()+'-'+uid()+'.jpg'});});});S.issues.forEach(o=>{(o.photos||[]).forEach((p,i)=>{if(isDataURI(p))jobs.push({o,i,t:'issues',path:'issues/'+o.id+'/'+now()+'-'+uid()+'.jpg'});});});S.movements.forEach(o=>{(o.photos||[]).forEach((p,i)=>{if(isDataURI(p))jobs.push({o,i,t:'movements',path:'movements/'+o.id+'/'+now()+'-'+uid()+'.jpg'});});});
  for(const j of jobs.slice(0,PHOTO_FLUSH_CAP)){const ctl=(typeof AbortController!=='undefined')?new AbortController():null;let tm=null;
    try{const up=sb.storage.from('unit-photos').upload(j.path,dataURItoBlob(j.o.photos[j.i]),{contentType:'image/jpeg',signal:ctl?ctl.signal:undefined});
      const {error}=await Promise.race([up,new Promise((_,rej)=>{tm=setTimeout(()=>{if(ctl)ctl.abort();rej(new Error('timeout'));},PHOTO_UPLOAD_MS);})]);
      clearTimeout(tm);if(error)continue;
      const {data}=sb.storage.from('unit-photos').getPublicUrl(j.path);if(data&&data.publicUrl){j.o.photos[j.i]=data.publicUrl;if(d){const e=(d.ups[j.t]||[]).find(x=>x.id===j.o.id);if(e){e.row=Object.assign({},e.row,{photos:j.o.photos.slice()});e.rs=JSON.stringify(e.row);}}}}
    catch(e){clearTimeout(tm);}}}

/* Identity header — pinned to the top of every check form, all units. Answers
   "what am I standing in front of, and what did it read last time?" without a
   tap. On a TwinPak it also answers WHICH ENGINE, which the form used to drop
   the moment you left the selection screen. The last-recorded figure is the
   REFERENCE that lets the hours input stay blank: reference visible, value
   observed. */
/* The header pairs a number with a person and a timestamp, so all three must come
   from the SAME observation — otherwise it attributes a reading to someone who
   never took it. Returns the source row when a real check supplied the number, and
   falls back to the stored seed only when no check ever did. Mirrors engHours: on a
   TwinPak, B never falls back. */
function lastRecordedHours(u,e){
  const rs=e?engReports(u,e):reportsFor(u.id);
  const r=rs.find(x=>x.engineHours!=null);
  if(r)return{hrs:r.engineHours,src:r};
  if(isTwin(u)&&e==='B')return{hrs:null,src:null};
  return{hrs:(u&&u.currentHours!=null)?u.currentHours:null,src:null};}
function identityCard(u,e){

  const lr=lrh.src;const ts=lr?lr.timestamp:null;
  const cs=computeStatus(u);
  return `<div class="card" style="padding:11px 13px;margin:0 0 12px;border-left:5px solid ${SC[cs.color]}">
    <div class="between"><b style="font-size:15px">#${esc(u.serial||u.tagId||'—')}</b>${e?`<span class="pill" style="background:var(--accent)">${esc(engName(u,e))}</span>`:''}</div>
    <div class="muted" style="font-size:12px;margin-top:2px">${esc([u.make,u.model].filter(Boolean).join(' ')||(u.klass==='big'?'Big iron':'Small iron'))}${u.config?(' · '+esc(u.config)):''}</div>
    <div class="between" style="margin-top:8px;align-items:baseline"><span class="lb" style="margin:0">LAST RECORDED</span><span style="font-size:15px;font-weight:600">${hrs!=null?(Number(hrs).toLocaleString()+' h'):'<span class="muted" style="font-size:13px;font-weight:400">No checks yet</span>'}</span></div>
    ${(hrs!=null&&engPreSplit(u,e))?'<div class="muted" style="font-size:11px;margin-top:3px">pre-split reading</div>':''}
    ${ts?`<div class="muted" style="font-size:11px;margin-top:3px">${esc(fmtAgo(ts))}${lr&&lr.techName?(' · '+esc(lr.techName)):''}</div>`:''}
  </div>`;}
/* One row per engine on a TwinPak. The split has to be obvious at a glance —
   a red chassis chip must never read as "the whole trailer is dead". */
function engineRow(u,e){

  </div>`;}
function renderUnit(id){const u=unitById(id);if(!u){closeSheet();return;}const cs=computeStatus(u);const sv=serviceState(u);

function vk(k,v,uu){if(v==null||v==='')return '';return `<div class="k">${k}</div><div>${esc(v)}${uu}</div>`;}
/* Derived load (2026-08-10): small iron has no kW meter, so techs log amps and
   volts and the load picture goes blank. Derived at READ time, never stored —
   every input (V, all three legs, rating_kva) is already stamped on the row, so
   storing would freeze today's formula into history for nothing. Definition:
   apparent power over nameplate, sqrt(3)*V_LL*(sum A)/3 / (kVA*1000). NO power-
   factor assumption — it cancels against the rating's 0.8 (a metered check's %
   equals this x PF/0.8, so derived reads <=~20% low worst case, direction known).
   Sum of legs so imbalance counts every amp; all three legs required because one
   leg probably means single-phase, where sqrt(3) is flat wrong. Metered always
   wins; the blank kW stays blank — blank means NOT METERED. Display marks every
   derived value "~N% est"; it must never appear on the check form itself (the
   observation rule: never show a tech a number they're supposed to read). */
function derivedLoadPct(r){
  if(!r||r.loadKw!=null||r.loadPct!=null)return null;
  if(r.voltageLL==null||r.ampsL1==null||r.ampsL2==null||r.ampsL3==null)return null;
  const kva=r.ratingKva;if(!(kva>0))return null;
  const va=Math.sqrt(3)*r.voltageLL*(r.ampsL1+r.ampsL2+r.ampsL3)/3;
  return Math.round(va/(kva*10));}
/* ===== UNIT HISTORY (2026-08-11) — general backward-looking access =====
   The app showed only the latest check and a flat 25-row log; answering "what
   has this unit been doing" required analysis outside the app. summarizeChecks
   is PURE (window in, numbers out) and must only ever be fed through the
   reportsFor() choke point — a voided check must never reach the runtime walk.
   Runtime uses a LAST-ACCEPTED WALK because the archives proved meters get
   fat-fingered and swapped: accept a pair only if 0 <= delta <= elapsed*1.1+2h
   (a meter can't outrun the clock; slack for drift and same-visit re-reads),
   and on reject DON'T advance the anchor — 100, 9999, 110 yields 10 h, not 0
   and never a negative. Accepted edge: a mid-window meter replacement
   undercounts runtime — fails safe, never fabricates hours. Duty divides by
   the span of ACCEPTED readings, not the 30-day window, and stays null under
   24 h of span. */
function summarizeChecks(win){
  const hs=win.filter(r=>r.engineHours!=null).slice().reverse();
  let runHrs=null,dutyPct=null;
  if(hs.length>=2){let last=hs[0],run=0,acc=1;
    for(let i=1;i<hs.length;i++){const r=hs[i];const d=r.engineHours-last.engineHours;const dtH=(r.timestamp-last.timestamp)/3600e3;
      if(d>=0&&d<=dtH*1.1+2){run+=d;last=r;acc++;}}
    if(acc>=2){runHrs=Math.round(run);const spanH=(last.timestamp-hs[0].timestamp)/3600e3;
      dutyPct=spanH>=24?Math.min(100,Math.round(run/spanH*100)):null;}}
  const vals=win.map(r=>r.loadPct!=null?{v:r.loadPct,est:false}:(derivedLoadPct(r)!=null?{v:derivedLoadPct(r),est:true}:null)).filter(Boolean);
  let medLoad=null,peakLoad=null,medLoadEst=false;
  if(vals.length){const vs=vals.map(x=>x.v).sort((a,b)=>a-b);const m=vs.length>>1;
    medLoad=Math.round(vs.length%2?vs[m]:(vs[m-1]+vs[m])/2);peakLoad=vs[vs.length-1];medLoadEst=vals.some(x=>x.est);}
  const cools=win.map(r=>r.coolantTemp).filter(v=>v!=null);
  return {n:win.length,runHrs,dutyPct,medLoad,medLoadEst,peakLoad,loadN:vals.length,maxCool:cools.length?Math.max(...cools):null};}
/* The summary card is deliberately OUTSIDE the History collapse — it IS the
   answer to "what has it been doing lately"; only the long list hides. Always
   the fixed 30-day window regardless of Show-all, titled by its window so it
   can't lie. Two checks minimum: one check earns no summary, the Latest card
   already says everything. */
function checkSummary(u,rs){const cut=now()-30*864e5;const win=rs.filter(r=>r.timestamp>=cut);
  if(win.length<2)return '';
  const s=summarizeChecks(win);
  const iss=issuesFor(u.id);const opened=iss.filter(i=>i.timestamp>=cut).length;const open=iss.filter(i=>!i.resolved).length;
  const loadTxt=s.loadN?((s.medLoadEst?'~':'')+s.medLoad+'%'+(s.medLoadEst?' est':'')+((s.peakLoad!=null&&s.peakLoad!==s.medLoad)?(' · peak '+s.peakLoad+'%'):'')):null;
  return `<div class="card" style="padding:13px;margin-bottom:12px"><div class="between"><b>Last 30 days</b><span class="muted" style="font-size:12px">${win.length} checks</span></div><div class="kv" style="margin-top:9px">${vk('Run time',s.runHrs!=null?(s.runHrs+' h'):null,'')}${vk('Duty',s.dutyPct!=null?(s.dutyPct+'% of clock'):null,'')}${vk('Load (median)',loadTxt,'')}${vk('Coolant (max)',s.maxCool!=null?(s.maxCool+'°'):null,'')}${(opened||open)?vk('Issues',opened+' opened · '+open+' open',''):''}</div></div>`;}
function checkLogRow(u,r){const tw=isTwin(u);
  const a=[r.ampsL1,r.ampsL2,r.ampsL3].filter(v=>v!=null);const av=a.length?Math.round(a.reduce((s,v)=>s+v,0)/a.length):null;
  const etag=tw?`<span class="chip" style="font-size:10px;margin-left:6px">${r.engine?esc(engName(u,r.engine)):'pre-split'}</span>`:'';
  return `<div class="card" style="padding:10px 13px;margin-bottom:7px"><div class="between"><b style="font-size:13px">${esc(r.techName||'—')}${etag}</b><span class="muted" style="font-size:11px">${fmtDate(r.timestamp)}</span></div><div class="muted" style="font-size:12px;margin-top:3px">${[r.voltageLL?('LL '+r.voltageLL+'V'):'',r.hz?(r.hz+'Hz'):'',(av!=null?(av+'A'):''),r.coolantTemp!=null?('cool '+r.coolantTemp+'°'):'',r.oilPressure!=null?('oil '+r.oilPressure+'psi'):'',r.fuelLevelPct!=null?('fuel '+r.fuelLevelPct+'%'):'',r.loadKw?(r.loadKw+'kW'):'',r.loadPct!=null?('load '+r.loadPct+'%'):(derivedLoadPct(r)!=null?('load ~'+derivedLoadPct(r)+'% est'):'')].filter(Boolean).join(' · ')||'no readings'}</div>${r.notes?`<div style="font-size:12px;margin-top:4px">📝 ${esc(r.notes)}${S.issues.some(x=>x.fromReportId===r.id)?' <span class="chip warn" style="font-size:10px">⚑ filed as issue</span>':''}</div>`:''}</div>`;}
/* Collapsed by default; day headers reuse the global .evday class. A day
   header names the show only when it CHANGES from the previous day — reading
   down the list reads like the unit's season. 200-row cap on Show-all follows
   the openGlobalLog precedent. */
function checkHistory(u,rs){if(!rs.length)return '';
  const cut=now()-30*864e5;const win=rs.filter(r=>r.timestamp>=cut);const total=rs.length;
  const head=(ar)=>`<h2 class="section sm" style="cursor:pointer" onclick="toggleHist('${u.id}')">${ar} History <span class="muted" style="font-weight:400;text-transform:none">— ${win.length} in 30 days · ${total} total</span></h2>`;
  if(!histOpen)return head('▸');

function recentChecksTable(rs){if(!rs||rs.length<2)return '';const cols=rs.slice(0,4);const METR=[['V L-L',r=>r.voltageLL],['Amps L1',r=>r.ampsL1],['Amps L2',r=>r.ampsL2],['Amps L3',r=>r.ampsL3],['Coolant °',r=>r.coolantTemp],['Oil psi',r=>r.oilPressure],['Fuel psi',r=>r.fuelPsi],['Load %',r=>r.loadPct!=null?r.loadPct:derivedLoadPct(r),r=>r.loadPct==null&&derivedLoadPct(r)!=null]];const rows=METR.filter(m=>cols.some(r=>m[1](r)!=null));if(!rows.length)return '';const head='<th class="rcm"></th>'+cols.map((r,i)=>`<th>${i===0?'<span class="rcnow">latest</span><br>':''}${esc(fmtAgo(r.timestamp))}<br><span class="rcw">${esc((String(r.techName||'').split(' ')[0])||'—')}</span></th>`).join('');const body=rows.map(m=>{return '<tr><td class="rcm">'+m[0]+'</td>'+cols.map((r,i)=>{const v=m[1](r);if(v==null)return '<td'+(i===0?' class="rclatest"':'')+'><span class="rcna">—</span></td>';const der=m[2]&&m[2](r);let arrow='';if(i===0){const pv=m[1](cols[1]);if(pv!=null&&pv!==v)arrow=' <span class="rcar">'+(v>pv?'▲':'▼')+'</span>';}return '<td'+(i===0?' class="rclatest"':'')+'>'+(der?('~'+v+arrow+' <span class="rcna">est</span>'):(v+arrow))+'</td>';}).join('')+'</tr>';}).join('');return `<div class="card" style="padding:12px 12px 10px;margin-bottom:12px"><div class="between" style="margin-bottom:8px"><span class="lb" style="margin:0">Recent checks</span><span class="muted" style="font-size:10px">newest → older · ▲▼ vs last</span></div><div style="overflow-x:auto;-webkit-overflow-scrolling:touch"><table class="rc"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div></div>`;}
function paneVitals(u){const tw=isTwin(u);const rs=(tw&&vitalsEng)?engReports(u,vitalsEng):reportsFor(u.id);const lr=rs[0];const g=lr&&lr.gps;const av=r=>{const a=[r.ampsL1,r.ampsL2,r.ampsL3].filter(x=>x!=null);return a.length?Math.round(a.reduce((s,x)=>s+x,0)/a.length):null;};
  const etag=r=>tw?`<span class="chip" style="font-size:10px;margin-left:6px">${r.engine?esc(engName(u,r.engine)):'pre-split'}</span>`:'';

function paneIssues(u){const is=issuesFor(u.id);return is.length?is.map(i=>`<div class="card" style="padding:12px;margin-bottom:9px;border-left:5px solid ${i.severity==='down'?'var(--red)':i.severity==='maintenance'?'var(--orange)':'var(--yellow)'}"><div class="between"><b>${esc(i.title||i.severity)}${(isTwin(u)&&i.engine)?`<span class="chip" style="font-size:10px;margin-left:6px">${esc(engName(u,i.engine))}</span>`:''}</b><button class="btn sm ${i.resolved?'ghost':'dark'}" onclick="toggleIssue('${i.id}','${u.id}')">${i.resolved?'Reopen':'Resolve'}</button></div><div style="font-size:13px;margin-top:4px">${esc(i.text||'')}</div>${i.photos&&i.photos.length?photoStrip(i.photos,"bigIssuePhoto('"+i.id+"',",null):''}<div class="muted" style="font-size:11px;margin-top:6px">${i.resolved?'✓ resolved · ':''}${fmtDate(i.timestamp)} · ${esc(i.techName||'')}${i.fromReportId?' · ⚑ from a check':''}</div></div>`).join(''):'<div class="empty" style="padding:22px"><p class="muted">No issues. 🎉</p></div>';}
function toggleIssue(iid,u_){const i=S.issues.find(x=>x.id===iid);if(i){i.resolved=!i.resolved;save();renderUnit(u_);}}
function serviceCard(u,e,sv){const cls=sv.state==='over'?'bad':(sv.state==='soon'?'warn':'ok');const cur=engHours(u,e);const due=e?engMeta(u,e).serviceDueHours:u.serviceDueHours;

function paneInfo(u,loc){return `<div class="card" style="padding:14px"><div class="kv"><div class="k">Serial</div><div>${esc(u.serial||'—')}</div><div class="k">Scan code</div><div>${esc(u.tagId||'—')}</div><div class="k">Type</div><div>${u.klass==='big'?'Big iron (Power Only)':'Small iron'}</div>${u.config?`<div class="k">Config</div><div>${esc(u.config)}</div>`:''}<div class="k">Make/Model</div><div>${esc([u.make,u.model].filter(Boolean).join(' ')||'—')}</div><div class="k">Rating</div><div>${u.kw?esc(u.kw)+' kVA':'—'}</div><div class="k">Breaker</div><div>${esc(u.breakerSize||'—')}</div><div class="k">Fuel</div><div>${esc(u.fuelType||'—')}${u.tankGallons?(' · '+esc(u.tankGallons)+' gal'):''}</div><div class="k">Weight</div><div>${u.weightLbs?Number(u.weightLbs).toLocaleString()+' lb':'—'}</div>${u.trailer?`<div class="k">Trailer</div><div>${esc(u.trailer)}</div>`:''}<div class="k">Location</div><div>${esc(loc)}</div></div>${u.notes?`<div style="margin-top:10px;font-size:13px">📝 ${esc(u.notes)}</div>`:''}<div style="margin-top:12px"><div class="lb" style="margin-bottom:6px">PHOTOS</div>${(u.photos&&u.photos.length)?renderUnitPhotos(u):''}<input type="file" id="unitPhotoInput" accept="image/*" style="display:none" onchange="handleUnitPhoto(this,'${u.id}')"/><button type="button" class="btn ghost sm" onclick="document.getElementById('unitPhotoInput').click()">📷 Add photo</button></div><button class="btn ghost block" style="margin-top:14px" onclick="editUnit('${u.id}')">Edit info</button></div>`;}
function paneMoves(u,loc){const sid=(u.locationType==='show'&&u.locationId)?u.locationId:null;const jmd=sid?jm(u,sid):{};const g=unitGps(u);const mv=S.movements.filter(x=>x.unitId===u.id).sort((a,b)=>b.timestamp-a.timestamp);return `${sid?`<div class="card" style="padding:14px;margin-bottom:12px"><div class="lb" style="margin-bottom:8px">On this job — ${esc(locName('show',sid))}</div><label class="fld"><span class="lb">Name (this job)</span><input id="jm_name" value="${esc(jmd.name||'')}" placeholder="e.g. Coca-Cola, Production"/></label><label class="fld"><span class="lb">Placement</span><input id="jm_area" value="${esc(jmd.area||'')}" placeholder="e.g. VIP South, Ferris Wheel"/></label><label class="fld"><span class="lb">Job note</span><textarea id="jm_note" style="min-height:50px">${esc(jmd.note||'')}</textarea></label><button class="btn primary block" onclick="saveJobMeta('${u.id}','${sid}')">Save job label</button><p class="muted" style="font-size:11px;margin-top:8px">Stays on this job only — won't follow the asset to the next show.</p></div>`:''}<div class="card" style="padding:14px;margin-bottom:12px"><div class="between"><b>Placement / GPS</b>${g?`<a href="https://www.google.com/maps?q=${g.lat},${g.lng}" target="_blank" rel="noopener noreferrer" style="font-size:12px">📍 ${g.lat}, ${g.lng}</a>`:'<span class="muted" style="font-size:12px">no pin yet</span>'}</div><button class="btn dark block" style="margin-top:10px" onclick="capturePlacement('${u.id}')">📍 Capture placement (use my location)</button><input type="file" id="plPhotoIn" accept="image/*" style="display:none" onchange="handlePlacementPhoto(this,'${u.id}')"/><button class="btn ghost block" style="margin-top:8px" onclick="document.getElementById('plPhotoIn').click()">📷 Placement photo</button><p class="muted" style="font-size:11px;margin-top:7px">Documents how it sits on <b>this</b> job — stays with this placement, not the asset. Not a location update.</p><button class="btn ghost block" style="margin- /* Make pick-list (2026-08-02): derived live from the fleet's distinct makes,
   grouped case-insensitively; the most common spelling in the fleet is the
   canonical option (ties break alphabetically). Free text survives via Other —
   a genuinely new manufacturer is never blocked. Model deliberately stays free
   text: it is identity owned by the NES import, not observation. */
function makeOptions(){const g=new Map();S.units.forEach(u=>{const m=String(u.make||'').trim();if(!m)return;const k=m.toLowerCase();if(!g.has(k))g.set(k,new Map());const v=g.get(k);v.set(m,(v.get(m)||0)+1);});
  return [...g.values()].map(v=>[...v.entries()].sort((a,b)=>(b[1]-a[1])||(a[0]<b[0]?-1:1))[0][0])
    .sort((a,b)=>a.toLowerCase()<b.toLowerCase()?-1:(a.toLowerCase()>b.toLowerCase()?1:0));}
function makeOther(sel){const o=$('#f_make_other');if(o)o.style.display=(sel.value==='__other')?'':'none';}
function editUnit(id,prefillTag){const u=id?unitById(id):{};const isNew=!id;formGps=null;const _eg=id?unitGps(u):null;const gpsStat=_eg?('📍 '+_eg.lat+', '+_eg.lng):'No pin yet';
  const locOpts=[...S.shows.map(s=>`<option value="show:${s.id}" ${(currentShow()&&currentShow().id===s.id)?'selected':''}>${esc(s.name)}</option>`),...S.shops.map(s=>`<option value="shop:${s.id}">${esc(s.name)}</option>`)].join('');
  sheet(isNew?'Add asset':'Edit asset',`${isNew&&prefillTag?`<div class="banner">🆕 New asset <b>${esc(prefillTag)}</b>. Fill in once. It stays with this unit.</div>`:''}
    <label class="fld"><span class="lb">Type</span><div><span class="chip" style="font-size:12px;padding:6px 12px">${(isNew||u.klass!=='big')?'Small iron':'Big iron · NES roster'}</span></div>${isNew?'<p class="muted" style="font-size:11px;margin:6px 0 0">Big iron exists on the NES roster and arrives by import — it isn’t created here.</p>':''}</label>
    <label class="fld"><span class="lb">Serial #</span><input id="f_serial" value="${esc(u.serial||prefillTag||'')}" placeholder="e.g. A246B12359 or 1LS01712/14" autocapitalize="characters" autocorrect="off" spellcheck="false" style="text-transform:uppercase"/></label>
    <div class="grid2"><label class="fld"><span class="lb">Scan code (optional)</span><input id="f_tag" value="${esc(u.tagId||'')}" placeholder="QR/barcode, if any" autocapitalize="characters" autocorrect="off" spellcheck="false" style="text-transform:uppercase"/></label><label class="fld"><span class="lb">Weight (lb)</span><input id="f_weight" type="number" inputmode="decimal" value="${esc(u.weightLbs||'')}"/></label></div>
    <div class="grid2"><label class="fld"><span class="lb">Make</span><select id="f_make" onchange="makeOther(this)"><option value="">— No make —</option>${makeOptions().map(m=>`<option value="${esc(m)}"${String(u.make||'').trim().toLowerCase()===m.toLowerCase()?' selected':''}>${esc(m)}</option>`).join('')}<option value="__other">Other…</option></select><input id="f_make_other" placeholder="Manufacturer name" style="display:none;margin-top:8px"/></label><label class="fld"><span class="lb">Model</span><input id="f_model" value="${esc(u.model||'')}" placeholder="XQ125"/></label></div>
    <div class="grid2"><label class="fld"><span class="lb">Rating (kVA)</span><input id="f_kw" type="number" inputmode="decimal" value="${esc(u.kw||'')}"/></label><label class="fld"><span class="lb">Breaker</span><input id="f_breaker" value="${esc(u.breakerSize||'')}" placeholder="400A"/></label></div>
    <div id="bigFields" style="display:${u.klass==='big'?'block':'none'}"><div class="grid2"><label class="fld"><span class="lb">Config</span><select id="f_config"><option value="">—</option>${['Single 300kW','Single 500kW','TwinPak','Double 500kW'].map(c=>`<option ${u.config===c?'selected':''}>${c}</option>`).join('')}</select></label><label class="fld"><span class="lb">Trailer #</span><input id="f_trailer" value="${esc(u.trailer||'')}"/></label></div>
      <div id="twinFields" style="display:${isTwin(u)?'block':'none'}">
        <label class="fld"><span class="lb">How is the housing labelled?</span><div class="segwrap" id="ls_seg"><button type="button" data-v="AB" class="${engStyle(u)==='AB'?'on':''}" style="${engStyle(u)==='AB'?'background:var(--accent);color:#fff':''}" onclick="lsseg(this)">Gen A / Gen B</button><button type="button" data-v="12" class="${engStyle(u)==='12'?'on':''}" style="${engStyle(u)==='12'?'background:var(--accent);color:#fff':''}" onclick="lsseg(this)">Gen 1 / Gen 2</button></div></label>
        ${engStyle(u)?'':'<p class="muted" style="font-size:11px;margin:-4px 0 10px">Not set. The engines read Engine 1 and Engine 2 until you pick.</p>'}
        <div class="grid2"><label class="fld"><span class="lb">Engine 1 nameplate kVA <b style="color:var(--red)">*</b></span><input id="f_kvaA" type="number" inputmode="decimal" value="${esc(engMeta(u,'A').kvaEach!=null?engMeta(u,'A').kvaEach:'')}" placeholder="off the nameplate"/></label><label class="fld"><span class="lb">Engine 2 nameplate kVA <b style="color:var(--red)">*</b></span><input id="f_kvaB" type="number" inputmode="decimal" value="${esc(engMeta(u,'B').kvaEach!=null?engMeta(u,'B').kvaEach:'')}" placeholder="off the nameplate"/></label></div>
        ${(engMeta(u,'A').kvaEach==null||engMeta(u,'B').kvaEach==null)?'<p class="muted" style="font-size:11px;margin:-4px 0 10px">From each engine\'s nameplate. Not the package rating split in two.</p>':''}
        <div class="grid2"><label class="fld"><span class="lb">Engine 1 hours</span><input id="f_hrsA" type="number" inputmode="decimal" value="" placeholder="read the meter"/></label><label class="fld"><span class="lb">Engine 2 hours</span><input id="f_hrsB" type="number" inputmode="decimal" value="" placeholder="read the meter"/></label></div>
        <p class="muted" style="font-size:11px;margin:-4px 0 12px">What each meter reads right now. Leave blank if you can't read it.</p>
      </div></div>
    <div class="grid2"><label class="fld"><span class="lb">Fuel type</span><input id="f_fuel" value="${esc(u.fuelType||'Diesel')}"/></label><label class="fld"><span class="lb">Tank (gal)</span><input id="f_tank" type="number" inputmode="decimal" value="${esc(u.tankGallons||'')}"/></label></div>
    ${(isNew||u.klass!=='big')?`<label class="fld"><span class="lb">DEF</span><div><button type="button" id="f_hasdef" class="btn sm" style="border:1.5px solid var(--blue);background:${u.hasDef===true?'var(--blue)':'transparent'};color:${u.hasDef===true?'#fff':'var(--blue)'}" onclick="hasDefT()">Has DEF tank</button></div><p class="muted" style="font-size:11px;margin:6px 0 0">Machine property — flip it once if this unit has DEF. The check form only asks for DEF % when it's on.</p></label>`:''}
    <hr class="sep"/><div class="grid2" id="flatHours" style="display:${isTwin(u)?'none':'grid'}"><label class="fld"><span class="lb">Current hrs</span><input id="f_hours" type="number" inputmode="decimal" value="${esc(u.currentHours!=null?u.currentHours:'')}"/></label><label class="fld"><span class="lb">Service due at (hrs)</span><input id="f_svc" type="number" inputmode="decimal" value="${esc(u.serviceDueHours!=null?u.serviceDueHours:'')}" placeholder="from sticker"/></label></div>
    ${(!id||unitShowId(u))?`<label class="fld"><span class="lb">Placement (this job)</span><input id="f_area" value="${esc(id?(jm(u,unitShowId(u)).area||''):'')}" placeholder="e.g. VIP South, Production"/></label>`:''}
    ${isNew?`<label class="fld"><span class="lb">Location</span><select id="f_loc">${locOpts}</select></label>`:''}

    <label class="fld"><span class="lb">Notes</span><textarea id="f_notes">${esc(u.notes||'')}</textarea></label>
    <button class="btn primary block" onclick="saveUnit('${id||''}')">${isNew?'Add asset':'Save'}</button>${!isNew?`<button class="btn ghost block" style="margin-top:9px" onclick="confirmDeleteUnit('${id}')">Delete unit</button>`:''}`,stopScanner);
  segStyle=engStyle(u);editHasDef=(u.hasDef===true);}
/* has_def is a machine property (null = no DEF), edited HERE and never on the
   check form — DEF presence is like kVA or tank size, not something observed
   today. State inits from the unit on every open so re-saving an untouched
   form never clears it. Becomes the backfill source for the future
   model-to-spec table. */
let editHasDef=false;
function hasDefT(){editHasDef=!editHasDef;const b=$('#f_hasdef');if(!b)return;
  b.style.background=editHasDef?'var(--blue)':'transparent';b.style.color=editHasDef?'#fff':'var(--blue)';}

function lsseg(b){segStyle=b.dataset.v==='12'?'12':'AB';document.querySelectorAll('#ls_seg button').forEach(x=>{x.classList.remove('on');x.style.background='';x.style.color='';});b.classList.add('on');b.style.background='var(--accent)';b.style.color='#fff';}
function saveUnit(id){let ser=$('#f_serial').value.trim().toUpperCase();let tag=$('#f_tag').value.trim().toUpperCase();if(!ser&&!tag){ser='GEN-'+now().toString(36).slice(-5).toUpperCase();}const norm=x=>String(x||'').trim().toLowerCase();const clash=S.units.find(u=>{if(u.id===id)return false;const us=norm(u.serial),ut=norm(u.tagId);return (ser&&(us===norm(ser)||ut===norm(ser)))||(tag&&(us===norm(tag)||ut===norm(tag)));});if(clash){toast('That serial/code is already in the fleet. Search for it to move it onto this job.');return;}
  if(id&&isTwin(unitById(id))){const _ka=$('#f_kvaA')?num($('#f_kvaA').value):null,_kb=$('#f_kvaB')?num($('#f_kvaB').value):null;

/* Show-days picker — the actual days the show runs, dark days simply unselected.
   A multi-weekend run (Thu–Sun, dark Mon–Wed, Thu–Sun) is eight selected dates;
   two boundary dates can't represent that, which is why this is a list. Phases
   are arithmetic from the list (before first = load-in, gaps = dark, after last
   = load-out) — never a workflow, never a required step. Saved as a sorted
   ISO-date array, null when empty — never []. */
const TZ_OPTS=[['','Auto from venue pin'],['America/New_York','Eastern'],['America/Chicago','Central'],['America/Denver','Mountain'],['America/Los_Angeles','Pacific']];
let calSel=new Set(),calY=0,calM=0;
function calInit(s){calSel=new Set(Array.isArray(s.showDays)?s.showDays:[]);const a=(calSel.size?[...calSel].sort()[0]:null)||s.startDate||null;const d=a?new Date(a+'T12:00:00'):new Date();calY=d.getFullYear();calM=d.getMonth();}
function calKey(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');}
function calNav(dm){calM+=dm;if(calM<0){calM=11;calY--;}else if(calM>11){calM=0;calY++;}renderCal();}
function calTog(k){if(calSel.has(k))calSel.delete(k);else calSel.add(k);renderCal();}
function renderCal(){const el=$('#sh_cal');if(!el)return;const first=new Date(calY,calM,1),off=first.getDay(),dim=new Date(calY,calM+1,0).getDate();
  let h='<div class="calhead"><button type="button" onclick="calNav(-1)">‹</button><b>'+first.toLocaleDateString(undefined,{month:'long',year:'numeric'})+'</b><button type="button" onclick="calNav(1)">›</button></div><div class="calgrid">';
  'SMTWTFS'.split('').forEach(d=>{h+='<span class="dow">'+d+'</span>';});
  for(let i=0;i<off;i++)h+='<span></span>';
  for(let d=1;d<=dim;d++){const k=calKey(calY,calM,d);h+='<button type="button" class="'+(calSel.has(k)?'on':'')+'" onclick="calTog(\''+k+'\')">'+d+'</button>';}
  el.innerHTML=h+'</div>';
  const c=$('#sh_calCount');if(c)c.textContent=calSel.size?(calSel.size+' show day'+(calSel.size===1?'':'s')+' selected — dark days stay unselected.'):'Tap the days the show runs. Multi-weekend? Pick both weekends; the dark days between stay unselected.';}
function tzGuess(site){if(!site||site.lng==null)return null;const x=+site.lng;return x>-85.5?'America/New_York':x>-102?'America/Chicago':x>-115?'America/Denver':'America/Los_Angeles';}
/* Compact date labels for cards. Show days render as consecutive runs so a
   two-weekend show reads "Apr 11–13 & 18–20", never eleven straight days. */
function fmtD(isoDate){return new Date(isoDate+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});}
function showDaysLabel(s){const sd=Array.isArray(s.showDays)&&s.showDays.length?[...s.showDays].sort():null;if(!sd)return '';
  const runs=[];let a=sd[0],b=sd[0];
  for(let i=1;i<sd.length;i++){if(Date.parse(sd[i]+'T12:00:00Z')-Date.parse(b+'T12:00:00Z')===86400e3)b=sd[i];else{runs.push([a,b]);a=b=sd[i];}}
  runs.push([a,b]);
  return runs.map(([x,y])=>x===y?fmtD(x):fmtD(x)+'–'+(x.slice(0,7)===y.slice(0,7)?String(+y.slice(8,10)):fmtD(y))).join(' & ');}
function jobDatesLine(s){const parts=[];const sd=showDaysLabel(s);if(sd)parts.push(sd);if(s.startDate)parts.push('starts '+fmtD(s.startDate));return parts.join(' · ');}
/* Phase is arithmetic from show_days, never a workflow: before the first show
   day = load-in, in the list = show, gaps inside = dark, after the last =
   load-out. Device-local dates — techs stand in the show's time zone. */
function phaseOf(s,dateStr){const sd=(s&&Array.isArray(s.showDays)&&s.showDays.length)?[...s.showDays].sort():null;if(!sd)return null;const d=dateStr||new Date().toLocaleDateString('en-CA');if(d<sd[0])return 'Load-in';if(sd.includes(d))return 'Show';if(d>sd[sd.length-1])return 'Load-out';return 'Dark';}

function exportData(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='fleetview-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();}
function importData(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{S=JSON.parse(rd.result);save();closeSheet();go(S.settings.homeTab==='fleet'?'fleet':'jobs');toast('Imported');}catch(e){toast('Invalid file');}};rd.readAsText(f);}
function wipe(){if(!confirm('Erase everything?'))return;S=blankState();save();closeSheet();go('jobs');}
/* ===== SHEET ===== */
let onSheetClose=null;
function sheet(title,html,onClose,noPad){onSheetClose=onClose||null;$('#sheet').innerHTML=`<div class="sh-top"><h3>${esc(title)}</h3><button class="closex" onclick="closeSheet()">✕</button></div><div class="sh-body" ${noPad?'style="padding-top:14px"':''}>${html}</div>`;$('#overlay').classList.add('on');}
function closeSheet(){if(onSheetClose){try{onSheetClose();}catch(e){}onSheetClose=null;}$('#overlay').classList.remove('on');render();}
/* ===== SERVICE WORKER (tap-to-update; kill switch lives in sw.js) ===== */
let swReg=null,swReloaded=false;
function initSW(){if(!('serviceWorker' in navigator)||location.protocol!=='https:')return;
  navigator.serviceWorker.register('sw.js').then(reg=>{swReg=reg;
    if(reg.waiting)swUpdateReady();
    reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(!nw)return;
      nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)swUpdateReady();});});
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(swReloaded)return;swReloaded=true;location.reload();});}
function swUpdateReady(){const b=$('#updateBar');if(b)b.style.display='';}
function applySwUpdate(){if(swReg&&swReg.waiting)swReg.waiting.postMessage('SKIP_WAITING');const b=$('#updateBar');if(b)b.style.display='none';}
/* ===== THEME ===== */
function applyTheme(){const t=(S.settings&&S.settings.theme==='light')?'light':'dark';document.documentElement.setAttribute('data-theme',t);const b=$('#themeBtn');if(b)b.textContent=t==='light'?'🌙':'☀️';const m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',t==='light'?'#fffdf7':'#191714');}
function toggleTheme(){S.settings.theme=(S.settings.theme==='light')?'dark':'light';save();applyTheme();toast(S.settings.theme==='light'?'☀️ Daylight':'🌙 Dark');}

/* ===== SAMPLE DATA (testing) ===== */

function removeSampleData(){const ids=new Set(S.shows.filter(s=>(s.name||'').startsWith('DEMO')).map(s=>s.id));if(!ids.size){toast('No sample data found');return;}const uids=new Set(S.units.filter(u=>ids.has(u.locationId)||ids.has(u.inTransitToShowId)).map(u=>u.id));S.units=S.units.filter(u=>!uids.has(u.id));S.reports=S.reports.filter(r=>!uids.has(r.unitId));S.issues=S.issues.filter(i=>!uids.has(i.unitId));S.movements=S.movements.filter(m=>!uids.has(m.unitId));S.shows=S.shows.filter(s=>!ids.has(s.id));if(ids.has(S.currentShowId))S.currentShowId=null;save();closeSheet();go('jobs');toast('Sample data removed');}
